<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chapters | ARS Education</title>
  <meta
    name="description"
    content="ARS Education — Class और Subject के अनुसार chapters."
  >

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="script.js" defer></script>
  <script src="education.js" defer></script>
  <script src="chapter.js" defer></script>

  <style>
    .chapter-page {
      padding: 42px 0 75px;
    }

    .chapter-hero {
      text-align: center;
      padding: 38px 22px;
      border-radius: 26px;
      background: linear-gradient(
        135deg,
        rgba(37,99,235,.10),
        rgba(147,51,234,.10)
      );
      border: 1px solid #e2e8f0;
      margin-bottom: 28px;
    }

    .chapter-hero h1 {
      margin: 0 0 10px;
      color: #172554;
      font-size: clamp(1.9rem, 5vw, 3rem);
    }

    .chapter-hero p {
      margin: 0 auto;
      max-width: 700px;
      color: #64748b;
      line-height: 1.7;
    }

    .subject-filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-bottom: 28px;
    }

    .subject-filter {
      border: 1px solid #dbe4f0;
      background: #fff;
      color: #475569;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
    }

    .subject-filter.active,
    .subject-filter:hover {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 20px;
    }

    .chapter-card {
      background: #fff;
      border: 1px solid #e5eaf2;
      border-radius: 20px;
      padding: 23px;
      box-shadow: 0 10px 28px rgba(15,23,42,.06);
    }

    .chapter-number {
      display: inline-flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #eef2ff;
      color: #4338ca;
      font-weight: 800;
      margin-bottom: 13px;
    }

    .chapter-card h2 {
      color: #172554;
      margin: 0 0 9px;
      font-size: 1.15rem;
    }

    .chapter-card p {
      color: #64748b;
      line-height: 1.65;
      margin-bottom: 17px;
    }

    .chapter-btn {
      display: inline-block;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 10px;
      color: #4338ca;
      background: #eef2ff;
      font-weight: 700;
    }

    .chapter-empty {
      text-align: center;
      padding: 40px 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 20px;
      color: #64748b;
    }

    @media (max-width: 850px) {
      .chapter-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 560px) {
      .chapter-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div id="pageLoader" class="page-loader">
    <div class="loader-spinner"></div>
  </div>

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="brand">
        <span class="brand-logo">🌹</span>
        <span>
          <strong>ARS Official</strong>
          <small>Adarsh Raj Shayar</small>
        </span>
      </a>

      <button
        class="menu-toggle"
        id="menuToggle"
        aria-label="Menu">
        ☰
      </button>

      <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="shayari.html">Shayari</a>
        <a href="stories.html">Stories</a>
        <a href="education.html" class="active">Education</a>
        <a href="founder.html">Founder</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
      </nav>

    </div>
  </header>

  <main class="chapter-page">
    <div class="container">

      <section class="chapter-hero">
        <h1 id="chapterTitle">📚 Chapters</h1>
        <p id="chapterDescription">
          विषय चुनें और उपलब्ध chapters देखें।
        </p>
      </section>

      <div
        id="subjectFilters"
        class="subject-filters">
      </div>

      <section
        id="chapterGrid"
        class="chapter-grid">
      </section>

      <div
        id="chapterEmpty"
        class="chapter-empty"
        style="display:none;">
        <h3>📚 अभी chapters उपलब्ध नहीं हैं</h3>
        <p>
          इस section की detailed educational content
          publisher/admin system से जोड़ी जाएगी।
        </p>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        © <span id="currentYear"></span> ARS Official — Adarsh Raj Shayar
      </p>
    </div>
  </footer>

  <button
    id="backToTop"
    class="back-to-top"
    aria-label="Back to top">
    ↑
  </button>

  <div id="toast" class="toast"></div>

</body>
</html>
