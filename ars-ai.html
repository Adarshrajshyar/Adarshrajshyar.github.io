<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>ARS AI | Adarsh Raj Shayar</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef1f5;
      color: #172033;
    }

    .ai-page {
      max-width: 900px;
      margin: auto;
      padding: 24px 16px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      padding: 10px 15px;
      border-radius: 9px;
      background: #111827;
      color: #fff;
      text-decoration: none;
    }

    .hero {
      text-align: center;
      color: #fff;
      padding: 45px 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, #111827, #374151);
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    .hero p {
      margin: 0;
      line-height: 1.6;
      opacity: .92;
    }

    .chat-card {
      background: #fff;
      margin-top: 22px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 7px 24px rgba(0,0,0,.08);
    }

    .chat-box {
      height: 430px;
      overflow-y: auto;
      padding: 15px;
      border-radius: 14px;
      background: #f7f8fa;
      border: 1px solid #e5e7eb;
    }

    .message {
      max-width: 82%;
      padding: 12px 14px;
      margin: 10px 0;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .bot {
      background: #e5e7eb;
      margin-right: auto;
    }

    .user {
      background: #111827;
      color: #fff;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      font-size: 15px;
    }

    .input-area button {
      border: 0;
      border-radius: 11px;
      padding: 0 20px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .quick-actions button {
      border: 1px solid #d1d5db;
      background: #fff;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
    }

    .note {
      margin-top: 20px;
      line-height: 1.7;
      opacity: .75;
      font-size: 14px;
    }
  </style>
</head>

<body>

<main class="ai-page">

  <a href="index.html" class="back">
    ← ARS Home
  </a>

  <section class="hero">
    <h1>ARS AI</h1>
    <p>
      Adarsh Raj Shayar का creative AI assistant
    </p>
  </section>

  <section class="chat-card">

    <div
      id="chatBox"
      class="chat-box"
    ></div>

    <div class="quick-actions">

      <button onclick="quickAsk('मेरे लिए एक शायरी बनाओ')">
        ✍️ Shayari
      </button>

      <button onclick="quickAsk('मेरे नाम पर एक शायरी बनाओ')">
        💫 Name Shayari
      </button>

      <button onclick="quickAsk('ARS क्या है?')">
        ℹ️ ARS
      </button>

      <button onclick="quickAsk('ARS AI क्या कर सकता है?')">
        🤖 About AI
      </button>

    </div>

    <div class="input-area">

      <input
        id="userInput"
        type="text"
        maxlength="500"
        placeholder="ARS AI से कुछ पूछें..."
        autocomplete="off"
      >

      <button onclick="sendMessage()">
        Send
      </button>

    </div>

    <p class="note">
      ARS AI का यह प्रारंभिक browser-based interface है।
      वास्तविक AI responses के लिए सुरक्षित server-side AI
      API integration की आवश्यकता होगी। API key को HTML या
      JavaScript में सीधे रखना सुरक्षित नहीं है।
    </p>

  </section>

</main>


<script>

(function () {

  const chatBox =
    document.getElementById("chatBox");

  const input =
    document.getElementById("userInput");


  function addMessage(text, type) {

    const message =
      document.createElement("div");

    message.className =
      "message " + type;

    message.textContent = text;

    chatBox.appendChild(message);

    chatBox.scrollTop =
      chatBox.scrollHeight;
  }


  function getLocalResponse(text) {

    const value =
      text.toLowerCase();


    if (
      value.includes("ars ai") ||
      value.includes("ai क्या") ||
      value.includes("ai kya")
    ) {

      return (
        "ARS AI, ARS website का creative assistant " +
        "interface है। भविष्य में इसे सुरक्षित AI backend " +
        "से जोड़कर बातचीत, writing help, ideas और " +
        "Shayari जैसी सुविधाएँ दी जा सकती हैं।"
      );

    }


    if (
      value.includes("ars क्या") ||
      value.includes("ars kya")
    ) {

      return (
        "ARS यानी Adarsh Raj Shayar. " +
        "यह platform Shayari, Stories, creative content " +
        "और future community features के लिए बनाया जा रहा है।"
      );

    }


    if (
      value.includes("शायरी") ||
      value.includes("shayari")
    ) {

      return (
        "बिल्कुल! ✨\n\n" +
        "आप जिस नाम या विषय पर शायरी चाहते हैं, " +
        "उसका नाम लिखिए। मैं उसके आधार पर एक " +
        "नई शायरी तैयार करने में मदद कर सकता हूँ।"
      );

    }


    if (
      value.includes("नमस्ते") ||
      value.includes("hello") ||
      value.includes("hi")
    ) {

      return (
        "नमस्ते! 👋\n" +
        "मैं ARS AI हूँ। आप मुझसे Shayari, Stories, " +
        "ARS या creative ideas के बारे में पूछ सकते हैं।"
      );

    }


    return (
      "आपका message मिला। 😊\n\n" +
      "यह ARS AI का प्रारंभिक offline assistant है। " +
      "Full AI conversation के लिए future में secure " +
      "AI backend जोड़ना होगा।"
    );

  }


  window.sendMessage = function () {

    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    addMessage(
      text,
      "user"
    );


    input.value = "";


    setTimeout(function () {

      addMessage(
        getLocalResponse(text),
        "bot"
      );

    }, 350);

  };


  window.quickAsk = function (text) {

    input.value = text;

    window.sendMessage();

  };


  input.addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Enter") {
        window.sendMessage();
      }

    }
  );


  addMessage(
    "नमस्ते! 👋 मैं ARS AI हूँ। आप मुझसे कुछ भी creative पूछ सकते हैं।",
    "bot"
  );

})();

</script>

</body>
</html>
