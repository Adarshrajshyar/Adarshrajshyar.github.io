<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARS AI | Adarsh Raj Shayar</title>
  <meta name="description" content="ARS AI - Adarsh Raj Shayar का AI Assistant.">

  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">

  <style>
    .ai-page {
      min-height: 100vh;
      padding: 100px 18px 50px;
    }

    .ai-container {
      width: min(950px, 100%);
      margin: auto;
    }

    .ai-hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .ai-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 24px;
      margin-bottom: 15px;
    }

    .ai-hero h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin: 0;
    }

    .ai-hero p {
      opacity: .75;
      margin-top: 10px;
    }

    .ai-card {
      background: var(--card-bg, rgba(255,255,255,.08));
      border: 1px solid rgba(128,128,128,.2);
      border-radius: 25px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
      backdrop-filter: blur(14px);
    }

    .ai-messages {
      height: 430px;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ai-message {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .ai-message.bot {
      align-self: flex-start;
      background: rgba(128,128,128,.12);
      border-bottom-left-radius: 5px;
    }

    .ai-message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .ai-input-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .ai-input {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(128,128,128,.3);
      background: transparent;
      color: inherit;
      border-radius: 14px;
      padding: 14px;
      outline: none;
      font-size: 1rem;
    }

    .ai-send {
      border: 0;
      border-radius: 14px;
      padding: 0 22px;
      cursor: pointer;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
    }

    .ai-shortcuts {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 15px;
    }

    .ai-shortcut {
      border: 1px solid rgba(128,128,128,.3);
      background: transparent;
      color: inherit;
      border-radius: 999px;
      padding: 8px 13px;
      cursor: pointer;
    }

    .ai-shortcut:hover {
      background: rgba(128,128,128,.12);
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <a href="index.html" class="brand">
        <img src="logo.png" alt="ARS Logo">
        <span>ARS</span>
      </a>

      <nav class="main-nav" aria-label="Main Navigation">
        <a href="index.html">Home</a>
        <a href="shayari.html">Shayari</a>
        <a href="story.html">Story</a>
        <a href="ars-ai.html" class="active">ARS AI</a>
        <a href="founder.html">Founder</a>
        <a href="verify.html">Verify</a>
        <a href="contact.html">Contact</a>
      </nav>

      <button
        type="button"
        class="theme-toggle"
        id="themeToggle"
        aria-label="Toggle theme">
        🌙
      </button>

    </div>
  </header>

  <main class="ai-page">
    <div class="ai-container">

      <section class="ai-hero">
        <img src="logo.png" class="ai-logo" alt="ARS">
        <h1>ARS <span>AI</span></h1>
        <p>Adarsh Raj Shayar का smart assistant</p>
      </section>

      <section class="ai-card">

        <div class="ai-messages" id="aiMessages">

          <div class="ai-message bot">
            नमस्ते 👋 मैं <strong>ARS AI</strong> हूँ।<br>
            आप मुझसे ARS, Shayari, Stories और सामान्य जानकारी से जुड़े सवाल पूछ सकते हैं।
          </div>

        </div>

        <div class="ai-shortcuts">
          <button class="ai-shortcut" data-question="ARS क्या है?">
            ARS क्या है?
          </button>

          <button class="ai-shortcut" data-question="एक motivation shayari सुनाओ">
            Motivation Shayari
          </button>

          <button class="ai-shortcut" data-question="ARS की website के बारे में बताओ">
            Website
          </button>

          <button class="ai-shortcut" data-question="Certificate verify कैसे करें?">
            Certificate Verify
          </button>
        </div>

        <div class="ai-input-row">
          <input
            id="aiInput"
            class="ai-input"
            type="text"
            autocomplete="off"
            placeholder="ARS AI से कुछ पूछें...">

          <button id="aiSend" class="ai-send" type="button">
            Send
          </button>
        </div>

      </section>

    </div>
  </main>

  <script>
    const input = document.getElementById("aiInput");
    const send = document.getElementById("aiSend");
    const messages = document.getElementById("aiMessages");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "ai-message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function getReply(question) {
      const q = question.toLowerCase();

      if (q.includes("ars") && q.includes("क्या")) {
        return "ARS, Adarsh Raj Shayar के creative, Shayari, Story, educational और digital projects का platform है।";
      }

      if (q.includes("motivation") || q.includes("मोटिवेशन")) {
        return "मुश्किल रास्ते अक्सर वहीं ले जाते हैं, जहाँ से नई शुरुआत सबसे खूबसूरत बनती है।";
      }

      if (q.includes("certificate") || q.includes("सर्टिफिकेट")) {
        return "Certificate Verify section में जाकर सही category चुनें और अपना Certificate ID या Joining Application Number दर्ज करें।";
      }

      if (q.includes("website") || q.includes("वेबसाइट")) {
        return "ARS website में Shayari, Stories, ARS AI, Founder, Certificates, Joining और Verification जैसी सुविधाएँ उपलब्ध हैं।";
      }

      if (
        q.includes("hello") ||
        q.includes("hi") ||
        q.includes("नमस्ते")
      ) {
        return "नमस्ते 👋 ARS AI में आपका स्वागत है।";
      }

      return "मैं अभी basic ARS Assistant mode में हूँ। आप ARS, Shayari, Story या Certificate Verification से जुड़ा सवाल पूछ सकते हैं।";
    }

    function sendMessage() {
      const question = input.value.trim();

      if (!question) return;

      addMessage(question, "user");
      input.value = "";

      setTimeout(() => {
        addMessage(getReply(question), "bot");
      }, 350);
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    document.querySelectorAll(".ai-shortcut").forEach(button => {
      button.addEventListener("click", () => {
        input.value = button.dataset.question;
        sendMessage();
      });
    });

    const themeToggle = document.getElementById("themeToggle");

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("ars-theme", theme);
      themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
    }

    const savedTheme = localStorage.getItem("ars-theme");

    if (savedTheme) {
      setTheme(savedTheme);
    } else {
      setTheme("light");
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.dataset.theme;
      setTheme(current === "dark" ? "light" : "dark");
    });
  </script>

</body>
</html>
