<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ARS Certificate</title>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="certificate.js"></script>

</head>


<body>


<header class="site-header">

  <nav class="navbar">

    <a class="brand" href="index.html">

      <img
        class="brand-logo"
        src="logo.png"
        alt="ARS Logo"
      >

      <span>

        <strong>ARS Official</strong>

        <small>Adarsh Raj Shayar</small>

      </span>

    </a>


    <div class="nav-links">

      <a href="index.html">Home</a>

      <a href="joining.html">Join ARS</a>

      <a class="active" href="certificate.html">
        Certificate
      </a>

      <a href="verify.html">Verify</a>

      <a href="founder.html">Founder</a>

    </div>

  </nav>

</header>


<main>

<section class="section">

  <div class="section-heading">

    <span>ARS OFFICIAL</span>

    <h2>Certificate Generator</h2>

    <p>
      अपना ARS Certificate तैयार करें।
    </p>

  </div>


  <div class="form-card">

    <form id="certificateForm">

      <div class="form-row">

        <div class="form-group">

          <label for="certificateName">
            Name / नाम
          </label>

          <input
            id="certificateName"
            required
            placeholder="पूरा नाम"
          >

        </div>


        <div class="form-group">

          <label for="certificateType">
            Certificate Type
          </label>

          <select id="certificateType" required>

            <option value="">
              Select Type
            </option>

            <option value="Professional">
              Professional
            </option>

            <option value="Achievement">
              Achievement
            </option>

            <option value="Participation">
              Participation
            </option>

            <option value="Business">
              Business
            </option>

          </select>

        </div>

      </div>


      <div
        id="businessFields"
        class="hidden"
      >

        <div class="form-row">

          <div class="form-group">

            <label for="businessName">
              Business Name
            </label>

            <input
              id="businessName"
              placeholder="Business Name"
            >

          </div>


          <div class="form-group">

            <label for="businessOwner">
              Owner / Founder
            </label>

            <input
              id="businessOwner"
              placeholder="Owner / Founder Name"
            >

          </div>

        </div>

      </div>


      <button
        class="primary-btn"
        type="submit"
      >
        Generate Certificate
      </button>

    </form>

  </div>


  <div
    id="certificateOutput"
    style="margin-top:30px;"
  ></div>

</section>

</main>


<footer class="site-footer">

  <div class="footer-inner">

    <div class="footer-brand">

      <img src="logo.png" alt="ARS Logo">

      <div>

        <h3>Adarsh Raj Shayar</h3>

        <p>
          ARS Official Certificate System
        </p>

      </div>

    </div>

  </div>

</footer>


<script>

document.addEventListener("DOMContentLoaded", function () {

  const type =
    document.getElementById("certificateType");

  const business =
    document.getElementById("businessFields");


  type.addEventListener("change", function () {

    business.classList.toggle(
      "hidden",
      this.value !== "Business"
    );

  });

});

</script>


</body>
</html>
