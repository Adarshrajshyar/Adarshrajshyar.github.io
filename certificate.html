<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ARS Certificate Generator</title>

    <link rel="icon" href="logo.png">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a href="index.html"
           class="brand">

            <img src="logo.png"
                 alt="ARS">

            <div>
                <strong>ARS</strong>
                <span>Certificate</span>
            </div>

        </a>

        <a href="index.html"
           class="btn btn-outline">
            ← Home
        </a>

    </div>

</header>


<main>

<section class="section">

    <div class="section-heading">

        <span class="eyebrow">
            🏆 ARS Certificate
        </span>

        <h1>Generate Certificate</h1>

        <p>
            नीचे अपनी जानकारी भरें।
        </p>

    </div>


    <form id="certificateForm"
          class="contact-form"
          style="max-width:700px;margin:auto;">

        <label>
            Name
            <input
                id="certificateName"
                type="text"
                placeholder="Full Name"
                required>
        </label>


        <label>
            Certificate Type

            <select
                id="certificateType"
                required>

                <option value="">
                    Select Certificate
                </option>

                <option value="Professional">
                    Professional
                </option>

                <option value="Business">
                    Business
                </option>

                <option value="Achievement">
                    Achievement
                </option>

                <option value="Participation">
                    Participation
                </option>

            </select>

        </label>


        <div id="businessFields"
             style="display:none;">

            <label>
                Business Name

                <input
                    id="businessName"
                    type="text"
                    placeholder="Business Name">
            </label>


            <label>
                Owner / Founder Name

                <input
                    id="ownerName"
                    type="text"
                    placeholder="Owner / Founder Name">
            </label>

        </div>


        <button
            type="submit"
            class="btn btn-primary">

            Generate Certificate →

        </button>

    </form>


    <div id="certificateResult"
         style="max-width:700px;margin:25px auto;">
    </div>

</section>

</main>


<script src="config.js"></script>
<script src="certificate.js"></script>

</body>
</html>
