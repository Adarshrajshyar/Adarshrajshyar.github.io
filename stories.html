<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stories & Poetry | ARS Official</title>
  <meta name="description" content="ARS Official पर मौलिक कहानियाँ और कविताएँ पढ़ें।">

  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="script.js" defer></script>
  <script src="stories.js" defer></script>

  <style>
    .stories-page {
      padding: 40px 0 70px;
    }

    .stories-hero {
      background:
        linear-gradient(135deg, rgba(91, 141, 239, .14), rgba(236, 72, 153, .12)),
        #fff;
      border: 1px solid rgba(91, 141, 239, .16);
      border-radius: 28px;
      padding: 42px 25px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(30, 64, 175, .08);
      margin-bottom: 30px;
    }

    .stories-hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      background: linear-gradient(90deg, #2563eb, #db2777, #9333ea);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stories-hero p {
      max-width: 750px;
      margin: auto;
      color: #64748b;
      line-height: 1.8;
    }

    .stories-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .stories-search {
      width: min(100%, 500px);
      padding: 14px 18px;
      border: 1px solid #dbe4f0;
      border-radius: 999px;
      outline: none;
      background: #fff;
      color: #1e293b;
      font-size: 1rem;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .05);
    }

    .stories-search:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, .10);
    }

    .story-filters {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 5px 2px 14px;
      margin-bottom: 28px;
      scrollbar-width: thin;
    }

    .story-filter {
      border: 1px solid #dbe4f0;
      background: #fff;
      color: #475569;
      padding: 10px 17px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: .2s ease;
    }

    .story-filter:hover,
    .story-filter.active {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #2563eb, #9333ea);
      transform: translateY(-1px);
    }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .story-card {
      background: #fff;
      border: 1px solid #e6edf6;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .06);
      display: flex;
      flex-direction: column;
      min-height: 280px;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .story-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 34px rgba(15, 23, 42, .10);
    }

    .story-type {
      display: inline-flex;
      width: fit-content;
      padding: 6px 11px;
      border-radius: 999px;
      background: #f3e8ff;
      color: #7e22ce;
      font-size: .78rem;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .story-card h2 {
      margin: 0 0 9px;
      color: #172554;
      font-size: 1.25rem;
    }

    .story-category {
      color: #64748b;
      font-size: .86rem;
      margin-bottom: 13px;
    }

    .story-excerpt {
      color: #475569;
      line-height: 1.75;
      flex: 1;
    }

    .story-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .story-action {
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #475569;
      border-radius: 10px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: .85rem;
    }

    .story-action:hover,
    .story-action.active {
      background: #eef2ff;
      color: #4338ca;
      border-color: #c7d2fe;
    }

    .story-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 20px;
      border-radius: 20px;
      background: #fff;
      border: 1px dashed #cbd5e1;
      color: #64748b;
    }

    @media (max-width: 950px) {
      .stories-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .stories-page {
        padding-top: 25px;
      }

      .stories-hero {
        padding: 32px 18px;
        border-radius: 22px;
      }

      .stories-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div id="pageLoader" class="page-loader">
    <div class="loader-spinner"></div>
  </div>

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="brand">
        <span class="brand-logo">🌹</span>
        <span>
          <strong>ARS Official</strong>
          <small>Adarsh Raj Shayar</small>
        </span>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        ☰
      </button>

      <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="shayari.html">Shayari</a>
        <a href="stories.html" class="active">Stories</a>
        <a href="founder.html">Founder</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
      </nav>

    </div>
  </header>

  <main class="stories-page">
    <div class="container">

      <section class="stories-hero">
        <h1>📖 Stories & Poetry</h1>
        <p>
          ARS Official पर मौलिक कहानियों और कविताओं की दुनिया में आपका स्वागत है।
          यहाँ जीवन, दोस्ती, सपनों, शिक्षा और प्रेरणा से जुड़ी रचनाएँ पढ़ें।
        </p>
      </section>

      <section class="stories-tools">

        <input
          type="search"
          id="storySearch"
          class="stories-search"
          placeholder="कहानी या कविता खोजें..."
          autocomplete="off"
        >

      </section>

      <div id="storyFilters" class="story-filters"></div>

      <section
        id="storiesGrid"
        class="stories-grid"
        aria-live="polite">
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        © <span id="currentYear"></span> ARS Official — Adarsh Raj Shayar
      </p>
    </div>
  </footer>

  <button
    id="backToTop"
    class="back-to-top"
    aria-label="Back to top">
    ↑
  </button>

  <div id="toast" class="toast"></div>

</body>
</html>
