<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
  >

  <title>ARS Publisher</title>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="shayari.js"></script>
  <script src="story.js"></script>

</head>

<body>

<header class="site-header">

  <nav class="navbar">

    <a href="index.html" class="logo">
      🌹 ARS Publisher
    </a>

    <div class="nav-links">

      <a href="index.html">Home</a>
      <a href="index.html#shayari">Shayari</a>
      <a href="index.html#stories">Stories</a>
      <a href="admin.html">Admin</a>

    </div>

  </nav>

</header>


<main class="section">


<!-- LOGIN -->

<section
  id="publisherLogin"
  class="form-card"
>

  <div style="text-align:center">

    <img
      src="logo.png"
      alt="ARS Logo"
      style="width:80px;height:80px;object-fit:contain"
      onerror="this.style.display='none'"
    >

    <h1>✍️ ARS Publisher</h1>

    <p>
      केवल authorized publisher ही content publish कर सकता है।
    </p>

  </div>


  <input
    id="publisherPassword"
    type="password"
    placeholder="Publisher Password"
    autocomplete="current-password"
  >

  <button
    id="publisherLoginButton"
    class="btn"
  >
    🔐 Login
  </button>

  <p id="publisherLoginMessage"></p>

</section>


<!-- DASHBOARD -->

<section
  id="publisherDashboard"
  style="display:none"
>

  <div class="panel-card">

    <h1>🌹 ARS Publisher Dashboard</h1>

    <p>
      यहाँ से Shayari और Story/Poem publish करें।
    </p>

    <button
      id="publisherLogout"
      class="btn"
    >
      Logout
    </button>

  </div>


  <!-- SHAYARI -->

  <div
    class="form-card"
    style="margin-top:25px"
  >

    <h2>🌹 Publish Shayari</h2>

    <form id="shayariForm">

      <label>
        Shayari
      </label>

      <textarea
        id="shayariText"
        required
        maxlength="1000"
        placeholder="अपनी Shayari लिखें..."
      ></textarea>


      <label>
        Category
      </label>

      <select id="shayariCategory" required>

        <option value="love">❤️ Love</option>
        <option value="sad">💔 Sad</option>
        <option value="motivational">🔥 Motivational</option>
        <option value="friendship">🤝 Friendship</option>
        <option value="attitude">😎 Attitude</option>

      </select>


      <label>
        Author
      </label>

      <input
        id="shayariAuthor"
        value="Adarsh Raj"
        required
      >


      <button
        type="submit"
        class="btn"
      >
        🌹 Publish Shayari
      </button>

    </form>

  </div>


  <!-- STORY -->

  <div
    class="form-card"
    style="margin-top:25px"
  >

    <h2>📖 Publish Story / Poem</h2>

    <form id="storyForm">

      <label>
        Title
      </label>

      <input
        id="storyTitle"
        required
        maxlength="150"
        placeholder="Story / Poem Title"
      >


      <label>
        Type
      </label>

      <select id="storyType" required>

        <option value="story">
          📖 Story
        </option>

        <option value="poem">
          ✍️ Poem
        </option>

      </select>


      <label>
        Category
      </label>

      <select id="storyCategory" required>

        <option value="mystery">🔍 Mystery</option>
        <option value="horror">👻 Horror</option>
        <option value="biography">📜 Biography</option>
        <option value="inspiration">✨ Inspiration</option>
        <option value="life">🌱 Life</option>
        <option value="adventure">🗺️ Adventure</option>

      </select>


      <label>
        Content
      </label>

      <textarea
        id="storyContent"
        required
        maxlength="5000"
        placeholder="Story या Poem लिखें..."
      ></textarea>


      <label>
        Author
      </label>

      <input
        id="storyAuthor"
        value="Adarsh Raj"
        required
      >


      <button
        type="submit"
        class="btn"
      >
        📖 Publish
      </button>

    </form>

  </div>


  <div
    id="publisherMessage"
    class="panel-card"
    style="display:none;margin-top:25px"
  ></div>

</section>

</main>


<script>

"use strict";

const PUBLISHER_SESSION =
  "ARS_PUBLISHER_SESSION";


const loginBox =
  document.getElementById("publisherLogin");

const dashboard =
  document.getElementById("publisherDashboard");

const passwordInput =
  document.getElementById("publisherPassword");

const loginButton =
  document.getElementById("publisherLoginButton");

const loginMessage =
  document.getElementById("publisherLoginMessage");


function showDashboard() {

  loginBox.style.display = "none";
  dashboard.style.display = "block";

}


function publisherLogin() {

  if (
    passwordInput.value ===
    window.ARS_CONFIG.PUBLISHER_PASSWORD
  ) {

    sessionStorage.setItem(
      PUBLISHER_SESSION,
      "1"
    );

    showDashboard();

  } else {

    loginMessage.textContent =
      "❌ गलत Publisher Password";

  }

}


loginButton.addEventListener(
  "click",
  publisherLogin
);


passwordInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      publisherLogin();
    }

  }
);


document
  .getElementById("publisherLogout")
  .addEventListener(
    "click",
    () => {

      sessionStorage.removeItem(
        PUBLISHER_SESSION
      );

      location.reload();

    }
  );


/* ---------------- SHAYARI PUBLISH ---------------- */

document
  .getElementById("shayariForm")
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();

      const item =
        ARS_SHAYARI.publish({

          text:
            document
              .getElementById("shayariText")
              .value
              .trim(),

          category:
            document
              .getElementById("shayariCategory")
              .value,

          author:
            document
              .getElementById("shayariAuthor")
              .value
              .trim()

        });


      showPublisherMessage(
        `✅ Shayari published successfully — ${item.id}`
      );

      event.target.reset();

      document
        .getElementById("shayariAuthor")
        .value = "Adarsh Raj";

    }
  );


/* ---------------- STORY PUBLISH ---------------- */

document
  .getElementById("storyForm")
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();

      const item =
        ARS_STORY.publish({

          title:
            document
              .getElementById("storyTitle")
              .value
              .trim(),

          content:
            document
              .getElementById("storyContent")
              .value
              .trim(),

          type:
            document
              .getElementById("storyType")
              .value,

          category:
            document
              .getElementById("storyCategory")
              .value,

          author:
            document
              .getElementById("storyAuthor")
              .value
              .trim()

        });


      showPublisherMessage(
        `✅ ${item.type === "poem" ? "Poem" : "Story"} published successfully — ${item.id}`
      );

      event.target.reset();

      document
        .getElementById("storyAuthor")
        .value = "Adarsh Raj";

    }
  );


function showPublisherMessage(message) {

  const box =
    document.getElementById(
      "publisherMessage"
    );

  box.textContent = message;
  box.style.display = "block";

  box.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


/* Restore login */

if (
  sessionStorage.getItem(
    PUBLISHER_SESSION
  ) === "1"
) {

  showDashboard();

}

</script>

</body>
</html>
