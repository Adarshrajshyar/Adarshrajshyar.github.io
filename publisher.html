<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>ARS Publisher Panel</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="shayari.js"></script>
  <script src="story.js"></script>

</head>

<body>

<header class="site-header">

  <nav class="navbar">

    <a
      class="logo"
      href="index.html"
    >
      🌹 ARS Publisher
    </a>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="admin.html">
        Admin
      </a>

      <a href="verify.html">
        Verify
      </a>

    </div>

  </nav>

</header>


<main class="section">


  <!-- LOGIN -->

  <section
    id="publisherLogin"
    class="form-card"
  >

    <h1>
      ✍️ Publisher Login
    </h1>

    <p>
      Login to publish Shayari, Stories and Poems.
    </p>

    <input
      id="publisherPassword"
      type="password"
      placeholder="Publisher Password"
      autocomplete="current-password"
    >

    <button
      class="btn"
      id="publisherLoginBtn"
      type="button"
    >
      Login
    </button>

    <p id="publisherLoginMessage"></p>

  </section>


  <!-- DASHBOARD -->

  <section
    id="publisherDashboard"
    style="display:none"
  >


    <div class="panel-card">

      <h1>
        ✨ ARS Publisher Dashboard
      </h1>

      <p>
        Publish new content without changing website code.
      </p>

      <button
        class="btn"
        id="publisherLogoutBtn"
        type="button"
      >
        Logout
      </button>

    </div>


    <!-- SHAYARI -->

    <div class="form-card">

      <h2>
        🌹 Publish Shayari
      </h2>

      <form id="shayariForm">

        <label>
          Shayari
        </label>

        <textarea
          id="shayariText"
          required
          placeholder="Write your Shayari here..."
        ></textarea>


        <label>
          Category
        </label>

        <select id="shayariCategory">

          <option value="love">
            Love
          </option>

          <option value="sad">
            Sad
          </option>

          <option value="attitude">
            Attitude
          </option>

          <option value="friendship">
            Friendship
          </option>

          <option value="motivation">
            Motivation
          </option>

          <option value="life">
            Life
          </option>

          <option value="inspiration">
            Inspiration
          </option>

          <option value="general">
            General
          </option>

        </select>


        <label>
          Author
        </label>

        <input
          id="shayariAuthor"
          value="Adarsh Raj"
          required
        >


        <button
          class="btn"
          type="submit"
        >
          🌹 Publish Shayari
        </button>

      </form>

      <p id="shayariPublishMessage"></p>

    </div>


    <!-- STORY / POEM -->

    <div class="form-card">

      <h2>
        📖 Publish Story / Poem
      </h2>

      <form id="storyForm">

        <label>
          Title
        </label>

        <input
          id="storyTitle"
          required
          placeholder="Story / Poem Title"
        >


        <label>
          Content
        </label>

        <textarea
          id="storyContent"
          required
          placeholder="Write your story or poem..."
        ></textarea>


        <label>
          Category
        </label>

        <select id="storyCategory">

          <option value="motivation">
            Motivation
          </option>

          <option value="life">
            Life
          </option>

          <option value="friendship">
            Friendship
          </option>

          <option value="education">
            Education
          </option>

          <option value="dream">
            Dream
          </option>

          <option value="inspiration">
            Inspiration
          </option>

          <option value="general">
            General
          </option>

        </select>


        <label>
          Content Type
        </label>

        <select id="storyType">

          <option value="story">
            Story
          </option>

          <option value="poem">
            Poem
          </option>

        </select>


        <label>
          Author
        </label>

        <input
          id="storyAuthor"
          value="Adarsh Raj"
          required
        >


        <button
          class="btn"
          type="submit"
        >
          📖 Publish
        </button>

      </form>

      <p id="storyPublishMessage"></p>

    </div>


    <!-- PUBLISHED SHAYARI -->

    <div class="panel-card">

      <h2>
        📝 Published Shayari
      </h2>

      <div
        id="publisherShayariList"
        class="grid"
      ></div>

    </div>


    <!-- PUBLISHED STORIES -->

    <div class="panel-card">

      <h2>
        📚 Published Stories
      </h2>

      <div
        id="publisherStoryList"
        class="grid"
      ></div>

    </div>


  </section>

</main>


<script>

"use strict";


const PUBLISHER_SESSION =
  "ARS_PUBLISHER_LOGGED_IN";


const publisherLogin =
  document.getElementById(
    "publisherLogin"
  );

const publisherDashboard =
  document.getElementById(
    "publisherDashboard"
  );

const publisherPassword =
  document.getElementById(
    "publisherPassword"
  );

const publisherLoginBtn =
  document.getElementById(
    "publisherLoginBtn"
  );

const publisherLogoutBtn =
  document.getElementById(
    "publisherLogoutBtn"
  );

const publisherLoginMessage =
  document.getElementById(
    "publisherLoginMessage"
  );


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function showPublisherDashboard() {

  publisherLogin.style.display =
    "none";

  publisherDashboard.style.display =
    "block";

  renderPublisherContent();

}


function showPublisherLogin() {

  publisherLogin.style.display =
    "block";

  publisherDashboard.style.display =
    "none";

}


publisherLoginBtn.addEventListener(
  "click",
  function () {

    if (
      publisherPassword.value ===
      ARS_CONFIG.PUBLISHER_PASSWORD
    ) {

      sessionStorage.setItem(
        PUBLISHER_SESSION,
        "true"
      );

      publisherLoginMessage.textContent =
        "";

      showPublisherDashboard();

    } else {

      publisherLoginMessage.textContent =
        "❌ Incorrect publisher password.";

    }

  }
);


publisherPassword.addEventListener(
  "keydown",
  function (event) {

    if (event.key === "Enter") {
      publisherLoginBtn.click();
    }

  }
);


publisherLogoutBtn.addEventListener(
  "click",
  function () {

    sessionStorage.removeItem(
      PUBLISHER_SESSION
    );

    publisherPassword.value = "";

    showPublisherLogin();

  }
);


document
  .getElementById("shayariForm")
  .addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

      try {

        ARS_SHAYARI.publish({

          text:
            document.getElementById(
              "shayariText"
            ).value.trim(),

          category:
            document.getElementById(
              "shayariCategory"
            ).value,

          author:
            document.getElementById(
              "shayariAuthor"
            ).value.trim()

        });


        document.getElementById(
          "shayariPublishMessage"
        ).textContent =
          "✅ Shayari published successfully.";

        this.reset();

        document.getElementById(
          "shayariAuthor"
        ).value =
          "Adarsh Raj";

        renderPublisherContent();

      } catch (error) {

        document.getElementById(
          "shayariPublishMessage"
        ).textContent =
          "❌ Could not publish Shayari.";

        console.error(error);

      }

    }
  );


document
  .getElementById("storyForm")
  .addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

      try {

        ARS_STORY.publish({

          title:
            document.getElementById(
              "storyTitle"
            ).value.trim(),

          content:
            document.getElementById(
              "storyContent"
            ).value.trim(),

          category:
            document.getElementById(
              "storyCategory"
            ).value,

          type:
            document.getElementById(
              "storyType"
            ).value,

          author:
            document.getElementById(
              "storyAuthor"
            ).value.trim()

        });


        document.getElementById(
          "storyPublishMessage"
        ).textContent =
          "✅ Content published successfully.";

        this.reset();

        document.getElementById(
          "storyAuthor"
        ).value =
          "Adarsh Raj";

        renderPublisherContent();

      } catch (error) {

        document.getElementById(
          "storyPublishMessage"
        ).textContent =
          "❌ Could not publish content.";

        console.error(error);

      }

    }
  );


function renderPublisherContent() {

  const shayariList =
    document.getElementById(
      "publisherShayariList"
    );

  const storyList =
    document.getElementById(
      "publisherStoryList"
    );


  const shayari =
    ARS_SHAYARI.all();


  shayariList.innerHTML =
    shayari.length

      ? shayari
          .map(item => `

            <article class="content-card">

              <span class="tag">
                ${escapeHTML(item.category)}
              </span>

              <p>
                ${escapeHTML(
                  item.text
                ).replace(
                  /\n/g,
                  "<br>"
                )}
              </p>

              <small>
                — ${escapeHTML(item.author)}
              </small>

              <br><br>

              <button
                class="btn"
                type="button"
                onclick="deleteShayari(
                  '${encodeURIComponent(item.id)}'
                )"
              >
                🗑 Delete
              </button>

            </article>

          `)
          .join("")

      : "<p>No Shayari published.</p>";


  const stories =
    ARS_STORY.all();


  storyList.innerHTML =
    stories.length

      ? stories
          .map(item => `

            <article class="content-card">

              <span class="tag">
                ${escapeHTML(item.category)}
                ·
                ${escapeHTML(item.type)}
              </span>

              <h3>
                ${escapeHTML(item.title)}
              </h3>

              <p>
                ${escapeHTML(
                  item.content
                ).replace(
                  /\n/g,
                  "<br>"
                )}
              </p>

              <small>
                — ${escapeHTML(item.author)}
              </small>

              <br><br>

              <button
                class="btn"
                type="button"
                onclick="deleteStory(
                  '${encodeURIComponent(item.id)}'
                )"
              >
                🗑 Delete
              </button>

            </article>

          `)
          .join("")

      : "<p>No stories published.</p>";

}


function deleteShayari(encodedId) {

  const id =
    decodeURIComponent(encodedId);

  if (
    !confirm(
      "Delete this Shayari?"
    )
  ) {
    return;
  }

  ARS_SHAYARI.remove(id);

  renderPublisherContent();

}


function deleteStory(encodedId) {

  const id =
    decodeURIComponent(encodedId);

  if (
    !confirm(
      "Delete this story?"
    )
  ) {
    return;
  }

  ARS_STORY.remove(id);

  renderPublisherContent();

}


if (
  sessionStorage.getItem(
    PUBLISHER_SESSION
  ) === "true"
) {

  showPublisherDashboard();

}

</script>

</body>
</html>
