<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>ARS Publisher | Adarsh Raj Shayar</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
    }

    .publisher-wrap {
      max-width: 1050px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .publisher-header {
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
      padding: 35px 25px;
      border-radius: 22px;
      margin-bottom: 25px;
      box-shadow: 0 12px 30px rgba(0,0,0,.15);
    }

    .publisher-header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .publisher-header p {
      margin: 0;
      opacity: .85;
    }

    .publisher-card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 22px;
      box-shadow: 0 7px 22px rgba(0,0,0,.08);
    }

    .publisher-card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 14px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      background: #111827;
      color: white;
    }

    button:hover {
      opacity: .88;
    }

    .danger {
      background: #b91c1c;
    }

    .success {
      background: #166534;
    }

    .logout {
      background: #6b7280;
    }

    .hidden {
      display: none !important;
    }

    .item {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      background: #fafafa;
    }

    .item strong {
      display: block;
      margin-bottom: 6px;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      background: #eef2ff;
    }
  </style>
</head>

<body>

<div class="publisher-wrap">

  <header class="publisher-header">
    <h1>ARS Publisher Panel</h1>
    <p>Adarsh Raj Shayar Official Website — Content Publishing System</p>
  </header>

  <!-- LOGIN -->
  <section id="loginSection" class="publisher-card">
    <h2>Publisher Login</h2>

    <label for="publisherPassword">Publisher Password</label>
    <input
      type="password"
      id="publisherPassword"
      placeholder="Password डालें"
      autocomplete="current-password"
    >

    <div class="btn-row">
      <button onclick="publisherLogin()">Login</button>
    </div>

    <div id="loginMessage" class="status hidden"></div>
  </section>


  <!-- PANEL -->
  <main id="publisherPanel" class="hidden">

    <section class="publisher-card">
      <h2>Publish New Content</h2>

      <label for="contentType">Content Type</label>
      <select id="contentType">
        <option value="shayari">Shayari</option>
        <option value="story">Story</option>
        <option value="update">Update</option>
      </select>

      <label for="contentCategory">Category</label>
      <select id="contentCategory">
        <option value="sad">Sad</option>
        <option value="love">Love</option>
        <option value="attitude">Attitude</option>
        <option value="friendship">Friendship</option>
        <option value="motivation">Motivation</option>
        <option value="poem">Poem</option>
        <option value="horror">Horror</option>
        <option value="emotional">Emotional</option>
        <option value="moral">Moral</option>
        <option value="mystery">Mystery</option>
        <option value="biography">Biography</option>
      </select>

      <label for="contentTitle">Title</label>
      <input
        type="text"
        id="contentTitle"
        placeholder="Content का title"
      >

      <label for="contentText">Content</label>
      <textarea
        id="contentText"
        placeholder="यहाँ Shayari / Story / Update लिखें..."
      ></textarea>

      <div class="btn-row">
        <button class="success" onclick="publishContent()">
          Publish
        </button>
      </div>

      <div id="publishMessage" class="status hidden"></div>
    </section>


    <section class="publisher-card">
      <h2>Published Content</h2>

      <div id="contentList">
        Loading...
      </div>
    </section>


    <section class="publisher-card">
      <h2>Publisher Controls</h2>

      <div class="btn-row">
        <button onclick="loadContent()">Refresh</button>
        <button class="logout" onclick="publisherLogout()">Logout</button>
      </div>
    </section>

  </main>

</div>


<script>
(function () {

  const PASSWORD = "ARS 2026";
  const STORAGE_KEY = "ARS_PUBLISHED_CONTENT";

  function getItems() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  window.publisherLogin = function () {

    const password =
      document.getElementById("publisherPassword").value;

    const message =
      document.getElementById("loginMessage");

    if (password === PASSWORD) {

      sessionStorage.setItem("ARS_PUBLISHER_LOGIN", "true");

      document
        .getElementById("loginSection")
        .classList.add("hidden");

      document
        .getElementById("publisherPanel")
        .classList.remove("hidden");

      loadContent();

    } else {

      message.textContent = "गलत Publisher Password.";
      message.classList.remove("hidden");
    }
  };


  window.publisherLogout = function () {

    sessionStorage.removeItem("ARS_PUBLISHER_LOGIN");

    location.reload();
  };


  window.publishContent = function () {

    const type =
      document.getElementById("contentType").value;

    const category =
      document.getElementById("contentCategory").value;

    const title =
      document.getElementById("contentTitle").value.trim();

    const text =
      document.getElementById("contentText").value.trim();

    const message =
      document.getElementById("publishMessage");

    if (!title || !text) {
      message.textContent =
        "Title और Content दोनों भरना जरूरी है.";
      message.classList.remove("hidden");
      return;
    }

    const items = getItems();

    items.unshift({
      id: "ARS-" + Date.now(),
      type,
      category,
      title,
      text,
      likes: 0,
      shares: 0,
      saves: 0,
      createdAt: new Date().toISOString()
    });

    saveItems(items);

    document.getElementById("contentTitle").value = "";
    document.getElementById("contentText").value = "";

    message.textContent = "Content successfully published.";
    message.classList.remove("hidden");

    loadContent();
  };


  window.editContent = function (id) {

    const items = getItems();
    const item = items.find(x => x.id === id);

    if (!item) return;

    const newTitle =
      prompt("New Title:", item.title);

    if (newTitle === null) return;

    const newText =
      prompt("New Content:", item.text);

    if (newText === null) return;

    item.title = newTitle.trim() || item.title;
    item.text = newText.trim() || item.text;

    saveItems(items);
    loadContent();
  };


  window.deleteContent = function (id) {

    if (!confirm("क्या आप इस content को delete करना चाहते हैं?")) {
      return;
    }

    const items =
      getItems().filter(item => item.id !== id);

    saveItems(items);
    loadContent();
  };


  window.loadContent = function () {

    const list =
      document.getElementById("contentList");

    const items = getItems();

    if (!items.length) {
      list.innerHTML =
        "<p>अभी कोई content publish नहीं किया गया है.</p>";
      return;
    }

    list.innerHTML = items.map(item => {

      return `
        <article class="item">
          <strong>${escapeHTML(item.title)}</strong>

          <small>
            ${escapeHTML(item.type)}
            •
            ${escapeHTML(item.category)}
          </small>

          <p>${escapeHTML(item.text)}</p>

          <div class="btn-row">
            <button onclick="editContent('${item.id}')">
              Edit
            </button>

            <button
              class="danger"
              onclick="deleteContent('${item.id}')"
            >
              Delete
            </button>
          </div>
        </article>
      `;

    }).join("");
  };


  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  if (
    sessionStorage.getItem("ARS_PUBLISHER_LOGIN") === "true"
  ) {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("publisherPanel")
      .classList.remove("hidden");

    loadContent();
  }

})();
</script>

</body>
</html>
