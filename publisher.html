<!DOCTYPE html>
<html lang="hi">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

  <title>ARS Publisher</title>

  <meta
    name="description"
    content="ARS Official Publisher Panel">

  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">

  <style>

    .publisher-wrap {
      max-width: 1050px;
      margin: 40px auto;
      padding: 20px;
    }

    .publisher-card {
      background: var(--card-bg,#fff);
      border: 1px solid rgba(128,128,128,.2);
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 12px 35px rgba(0,0,0,.07);
    }

    .publisher-actions {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .danger-btn {
      background:#b42318;
      color:#fff;
      border:0;
      border-radius:10px;
      padding:10px 14px;
      cursor:pointer;
    }

    .hidden {
      display:none !important;
    }

    textarea {
      min-height:160px;
      resize:vertical;
    }

  </style>

</head>

<body>

<header class="site-header">

  <div class="header-inner">

    <a href="index.html" class="brand">
      <img src="logo.png" alt="ARS Logo">
      <span>ARS</span>
    </a>

    <nav class="main-nav">

      <a href="index.html">Home</a>
      <a href="shayari.html">Shayari</a>
      <a href="story.html">Story</a>
      <a href="ars-ai.html">ARS AI</a>
      <a href="joining.html">Join ARS</a>
      <a href="certificate.html">Certificate</a>
      <a href="verify.html">Verify</a>
      <a href="founder.html">Founder</a>
      <a href="contact.html">Contact</a>

    </nav>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button">
      🌙
    </button>

  </div>

</header>


<main class="publisher-wrap">


  <!-- LOGIN -->

  <section
    id="publisherLogin"
    class="publisher-card">

    <p class="eyebrow">
      ARS PUBLISHER
    </p>

    <h1>
      Publisher Panel
    </h1>

    <p>
      Content publish करने के लिए password डालें।
    </p>

    <form id="publisherLoginForm">

      <div class="form-group">

        <label for="publisherPassword">
          Publisher Password
        </label>

        <input
          id="publisherPassword"
          type="password"
          autocomplete="current-password"
          required>

      </div>

      <button
        type="submit"
        class="primary-btn">
        🔐 Login
      </button>

    </form>

    <div
      id="publisherMessage"
      class="form-message">
    </div>

  </section>


  <!-- PANEL -->

  <section
    id="publisherPanel"
    class="hidden">


    <!-- CREATE -->

    <div class="publisher-card">

      <p class="eyebrow">
        CREATE CONTENT
      </p>

      <h2>
        नया Content Publish करें
      </h2>

      <form id="publishForm">

        <div class="form-group">

          <label for="contentType">
            Content Type
          </label>

          <select id="contentType">

            <option value="shayari">
              Shayari
            </option>

            <option value="story">
              Story
            </option>

            <option value="announcement">
              Announcement
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="contentCategory">
            Category
          </label>

          <input
            id="contentCategory"
            type="text"
            placeholder="Love / Motivation / etc."
            required>

        </div>


        <div class="form-group">

          <label for="contentTitle">
            Title
          </label>

          <input
            id="contentTitle"
            type="text"
            placeholder="Content title"
            required>

        </div>


        <div class="form-group">

          <label for="contentText">
            Content
          </label>

          <textarea
            id="contentText"
            placeholder="अपना content लिखें..."
            required></textarea>

        </div>


        <button
          type="submit"
          class="primary-btn">
          🚀 Publish
        </button>

      </form>

      <div
        id="publishMessage"
        class="form-message">
      </div>

    </div>


    <!-- CONTENT LIST -->

    <div class="publisher-card">

      <p class="eyebrow">
        PUBLISHED
      </p>

      <h2>
        Published Content
      </h2>

      <div id="publishedList"></div>

    </div>


    <div class="publisher-card">

      <button
        id="publisherLogout"
        class="secondary-btn"
        type="button">
        Logout
      </button>

    </div>

  </section>

</main>


<a
  href="#"
  id="backToTop"
  class="back-to-top">
  ↑
</a>


<script src="config.js"></script>
<script src="storage.js"></script>

<script>

(function () {

  "use strict";


  const PUBLISHER_PASSWORD =
    "ARS 2026";


  const login =
    document.getElementById(
      "publisherLogin"
    );

  const panel =
    document.getElementById(
      "publisherPanel"
    );

  const loginForm =
    document.getElementById(
      "publisherLoginForm"
    );

  const password =
    document.getElementById(
      "publisherPassword"
    );

  const loginMessage =
    document.getElementById(
      "publisherMessage"
    );

  const publishForm =
    document.getElementById(
      "publishForm"
    );

  const publishMessage =
    document.getElementById(
      "publishMessage"
    );

  const list =
    document.getElementById(
      "publishedList"
    );


  function read() {

    try {

      const data =
        JSON.parse(
          localStorage.getItem(
            "ARS_PUBLISHED_CONTENT"
          ) || "[]"
        );

      return Array.isArray(data)
        ? data
        : [];

    } catch {

      return [];

    }

  }


  function write(data) {

    localStorage.setItem(
      "ARS_PUBLISHED_CONTENT",
      JSON.stringify(data)
    );

  }


  function esc(value) {

    return String(value || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  function openPanel() {

    login.classList.add("hidden");
    panel.classList.remove("hidden");

    render();

  }


  function logout() {

    sessionStorage.removeItem(
      "ARS_PUBLISHER_LOGIN"
    );

    panel.classList.add("hidden");
    login.classList.remove("hidden");

  }


  loginForm.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

      if (
        password.value ===
        PUBLISHER_PASSWORD
      ) {

        sessionStorage.setItem(
          "ARS_PUBLISHER_LOGIN",
          "true"
        );

        openPanel();

      } else {

        loginMessage.textContent =
          "गलत password।";

        loginMessage.className =
          "form-message error";

      }

    }
  );


  document.getElementById(
    "publisherLogout"
  ).addEventListener(
    "click",
    logout
  );


  publishForm.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();


      const records =
        read();


      const record = {

        id:
          "ARS-CONTENT-" +
          Date.now(),

        type:
          document.getElementById(
            "contentType"
          ).value,

        category:
          document.getElementById(
            "contentCategory"
          ).value.trim(),

        title:
          document.getElementById(
            "contentTitle"
          ).value.trim(),

        text:
          document.getElementById(
            "contentText"
          ).value.trim(),

        date:
          new Date().toISOString(),

        author:
          "ARS Publisher"

      };


      records.unshift(record);

      write(records);


      publishMessage.textContent =
        "Content successfully publish हो गया।";

      publishMessage.className =
        "form-message success";


      publishForm.reset();

      render();

    }
  );


  function render() {

    const records =
      read();


    if (!records.length) {

      list.innerHTML =
        "<p>अभी कोई published content नहीं है।</p>";

      return;

    }


    list.innerHTML =
      records.map(
        function (item,index) {

          return `

            <article class="info-card">

              <small>
                ${esc(item.type)}
                •
                ${esc(item.category)}
              </small>

              <h3>
                ${esc(item.title)}
              </h3>

              <p>
                ${esc(item.text)}
              </p>

              <small>
                ${esc(item.date)}
              </small>

              <div class="publisher-actions">

                <button
                  class="secondary-btn"
                  data-edit="${index}">
                  ✏️ Edit
                </button>

                <button
                  class="danger-btn"
                  data-delete="${index}">
                  🗑️ Delete
                </button>

              </div>

            </article>

          `;

        }
      ).join("");

  }


  list.addEventListener(
    "click",
    function (event) {

      const deleteButton =
        event.target.closest(
          "[data-delete]"
        );

      const editButton =
        event.target.closest(
          "[data-edit]"
        );


      if (deleteButton) {

        const index =
          Number(
            deleteButton.dataset.delete
          );

        const records =
          read();

        if (
          confirm(
            "क्या आप इसे delete करना चाहते हैं?"
          )
        ) {

          records.splice(index,1);

          write(records);

          render();

        }

      }


      if (editButton) {

        const index =
          Number(
            editButton.dataset.edit
          );

        const records =
          read();

        const item =
          records[index];

        if (!item) return;


        const title =
          prompt(
            "Title:",
            item.title
          );

        if (title === null) return;


        const text =
          prompt(
            "Content:",
            item.text
          );

        if (text === null) return;


        item.title =
          title.trim();

        item.text =
          text.trim();


        records[index] =
          item;

        write(records);

        render();

      }

    }
  );


  if (
    sessionStorage.getItem(
      "ARS_PUBLISHER_LOGIN"
    ) === "true"
  ) {

    openPanel();

  }


  /* Theme */

  const themeToggle =
    document.getElementById(
      "themeToggle"
    );


  function applyTheme(theme) {

    document.documentElement.dataset.theme =
      theme;

    localStorage.setItem(
      "ars-theme",
      theme
    );

    themeToggle.textContent =
      theme === "dark"
        ? "☀️"
        : "🌙";

  }


  applyTheme(
    localStorage.getItem(
      "ars-theme"
    ) || "light"
  );


  themeToggle.addEventListener(
    "click",
    function () {

      const current =
        document.documentElement.dataset.theme ||
        "light";

      applyTheme(
        current === "dark"
          ? "light"
          : "dark"
      );

    }
  );

})();

</script>

</body>
</html>
