<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Books | ARS Education</title>
  <meta name="description" content="ARS Education NCERT books and chapters.">

  <link rel="stylesheet" href="style.css">

  <style>
    .books-page {
      min-height: 100vh;
      padding: 110px 18px 60px;
      background:
        radial-gradient(circle at 10% 10%, rgba(124,58,237,.14), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(236,72,153,.12), transparent 32%),
        var(--bg);
    }

    .books-container {
      max-width: 1100px;
      margin: auto;
    }

    .books-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .books-header h1 {
      font-size: clamp(30px, 5vw, 52px);
      margin-bottom: 10px;
    }

    .books-header span {
      color: var(--primary);
    }

    .books-header p {
      color: var(--text-soft);
    }

    .book-info {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .book-tag {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(124,58,237,.12);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .book-card {
      padding: 25px;
      border-radius: 20px;
      border: 1px solid rgba(124,58,237,.16);
      background: var(--card-bg, rgba(255,255,255,.06));
      box-shadow: 0 12px 35px rgba(0,0,0,.07);
      transition: .25s ease;
    }

    .book-card:hover {
      transform: translateY(-6px);
    }

    .book-icon {
      font-size: 34px;
      margin-bottom: 14px;
    }

    .book-card h2 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    .book-card p {
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.6;
      min-height: 45px;
    }

    .book-card button {
      width: 100%;
      margin-top: 10px;
      padding: 11px 15px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 45px 20px;
      border-radius: 20px;
      border: 1px dashed rgba(124,58,237,.3);
      color: var(--text-soft);
    }

    .back-btn {
      display: block;
      margin: 0 auto 28px;
      padding: 10px 16px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(124,58,237,.1);
      color: var(--primary);
      font-weight: 700;
    }

    @media (max-width: 850px) {
      .books-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .books-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="books-page">

    <div class="books-container">

      <header class="books-header">

        <h1>
          NCERT <span>Books</span>
        </h1>

        <p>
          अपनी कक्षा और विषय की पुस्तक चुनें।
        </p>

        <div class="book-info">
          <div class="book-tag" id="classTag">
            Class
          </div>

          <div class="book-tag" id="subjectTag">
            Subject
          </div>
        </div>

      </header>


      <button
        type="button"
        class="back-btn"
        onclick="goBack()"
      >
        ← वापस
      </button>


      <section id="booksGrid" class="books-grid"></section>


      <div id="emptyState" class="empty-state">
        <h2>📚 Content जल्द आएगा</h2>
        <p>
          इस subject के books और chapters Publisher Panel
          से जोड़ दिए जाएंगे।
        </p>
      </div>

    </div>

  </main>


  <script>
    (() => {
      "use strict";

      const params =
        new URLSearchParams(window.location.search);

      const classNumber =
        params.get("class") || "6";

      const subject =
        params.get("subject") || "maths";


      const classTag =
        document.getElementById("classTag");

      const subjectTag =
        document.getElementById("subjectTag");

      const booksGrid =
        document.getElementById("booksGrid");

      const emptyState =
        document.getElementById("emptyState");


      const subjectNames = {
        maths: "Mathematics",
        science: "Science",
        "social-science": "Social Science",
        hindi: "Hindi",
        english: "English",
        practice: "Notes & Practice"
      };


      classTag.textContent =
        `Class ${classNumber}`;

      subjectTag.textContent =
        subjectNames[subject] || subject;


      /*
       * अभी sample structure रखा गया है।
       * बाद में इसी जगह Backend/API/Database से
       * वास्तविक Books automatically आएंगी।
       */

      const books = {

        maths: [
          {
            title: "Mathematics",
            icon: "📐",
            description:
              "NCERT Mathematics textbook और chapters।"
          }
        ],

        science: [
          {
            title: "Science",
            icon: "🔬",
            description:
              "NCERT Science textbook और chapters।"
          }
        ],

        "social-science": [
          {
            title: "Social Science",
            icon: "🌍",
            description:
              "History, Geography और Civics।"
          }
        ],

        hindi: [
          {
            title: "Hindi",
            icon: "📖",
            description:
              "NCERT Hindi textbook और chapters।"
          }
        ],

        english: [
          {
            title: "English",
            icon: "🔤",
            description:
              "NCERT English textbook और chapters।"
          }
        ],

        practice: [
          {
            title: "Notes & Practice",
            icon: "📝",
            description:
              "Notes, MCQ, Practice और Exam Tips।"
          }
        ]

      };


      const selectedBooks =
        books[subject] || [];


      if (!selectedBooks.length) {

        emptyState.style.display =
          "block";

        return;
      }


      selectedBooks.forEach(book => {

        const card =
          document.createElement("article");

        card.className =
          "book-card";

        card.innerHTML = `
          <div class="book-icon">
            ${book.icon}
          </div>

          <h2>${book.title}</h2>

          <p>
            ${book.description}
          </p>

          <button
            type="button"
            data-book="${encodeURIComponent(book.title)}"
          >
            Chapters →
          </button>
        `;

        const button =
          card.querySelector("button");

        button.addEventListener("click", () => {

          const bookName =
            decodeURIComponent(
              button.dataset.book
            );

          const url =
            `chapters.html?class=${encodeURIComponent(classNumber)}&subject=${encodeURIComponent(subject)}&book=${encodeURIComponent(bookName)}`;

          window.location.href =
            url;

        });


        booksGrid.appendChild(card);

      });


      window.goBack = function () {

        if (document.referrer) {
          history.back();
        } else {
          window.location.href =
            "ncert.html";
        }

      };

    })();
  </script>

</body>
</html>
