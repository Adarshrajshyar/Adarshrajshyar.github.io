<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Join ARS</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .joining-page {
      max-width: 700px;
      margin: 45px auto;
      padding: 20px;
    }

    .joining-card {
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow:
        0 8px 30px rgba(0,0,0,.08);
    }

    .joining-card input,
    .joining-card textarea {
      width: 100%;
      padding: 13px;
      margin: 7px 0 15px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .joining-card textarea {
      min-height: 120px;
      resize: vertical;
    }

    .join-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .join-result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      display: none;
    }

  </style>

</head>

<body>

<header class="site-header">

  <nav class="navbar">

    <a href="index.html" class="logo">
      🌹 ARS
    </a>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="joining.html">
        Join ARS
      </a>

      <a href="certificate.html">
        Certificate
      </a>

      <a href="verify.html">
        Verify
      </a>

    </div>

  </nav>

</header>


<main class="joining-page">

  <section class="joining-card">

    <h1>
      🤝 Join ARS
    </h1>

    <p>
      Submit your joining request.
      Your request will be reviewed by ARS.
    </p>


    <form id="joiningForm">

      <label>
        Full Name
      </label>

      <input
        id="joinName"
        required
        placeholder="Enter your full name"
      >


      <label>
        Email
      </label>

      <input
        id="joinEmail"
        type="email"
        required
        placeholder="Enter your email"
      >


      <label>
        Why do you want to join ARS?
      </label>

      <textarea
        id="joinReason"
        placeholder="Write your message"
      ></textarea>


      <button
        type="submit"
        class="join-btn"
      >
        Submit Joining Request
      </button>

    </form>


    <div
      id="joinResult"
      class="join-result"
    ></div>

  </section>

</main>


<script src="config.js"></script>
<script src="storage.js"></script>

<script>

  document
    .getElementById("joiningForm")
    .addEventListener(
      "submit",
      function(e) {

        e.preventDefault();

        const name =
          document.getElementById(
            "joinName"
          ).value.trim();

        const email =
          document.getElementById(
            "joinEmail"
          ).value.trim();

        const reason =
          document.getElementById(
            "joinReason"
          ).value.trim();


        const request = {

          id:
            "ARS-JOIN-" +
            Date.now()
              .toString(36)
              .toUpperCase(),

          name: name,

          email: email,

          reason: reason,

          status:
            "pending",

          createdAt:
            new Date().toISOString()

        };


        window.ARS_STORAGE
          .saveJoiningRequest(
            request
          );


        const result =
          document.getElementById(
            "joinResult"
          );

        result.style.display =
          "block";

        result.innerHTML = `

          <strong>
            ✅ Request Submitted
          </strong>

          <p>
            Your request has been sent
            for ARS approval.
          </p>

          <p>
            Request ID:
            <strong>
              ${escapeHTML(request.id)}
            </strong>
          </p>

          <a
            href="verify.html?id=${encodeURIComponent(
              request.id
            )}"
          >
            Check Request Status
          </a>

        `;


        this.reset();

      }
    );


  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value == null ? "" : value;

    return div.innerHTML;

  }

</script>

</body>
</html>
