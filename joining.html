<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Join ARS — Adarsh Raj Shayar</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="config.js"></script>
  <script src="storage.js"></script>

</head>

<body>

<header class="site-header">

  <nav class="navbar">

    <a
      class="logo"
      href="index.html"
    >
      🌹 ARS Official
    </a>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="certificate.html">
        Certificate
      </a>

      <a href="verify.html">
        Verify
      </a>

      <a href="publisher.html">
        Publisher
      </a>

    </div>

  </nav>

</header>


<main class="section">

  <div class="form-card">

    <div style="text-align:center">

      <img
        src="logo.png"
        alt="ARS Logo"
        style="
          width:90px;
          height:90px;
          object-fit:contain;
        "
        onerror="this.style.display='none'"
      >

      <h1>
        🤝 Join ARS
      </h1>

      <p>
        Become a part of the ARS community.
      </p>

    </div>


    <form id="joinForm">

      <label for="joinName">
        Full Name
      </label>

      <input
        id="joinName"
        name="name"
        type="text"
        required
        minlength="2"
        maxlength="80"
        placeholder="Enter your full name"
        autocomplete="name"
      >


      <label for="joinEmail">
        Email Address
      </label>

      <input
        id="joinEmail"
        name="email"
        type="email"
        required
        placeholder="Enter your email"
        autocomplete="email"
      >


      <label for="joinReason">
        Why do you want to join ARS?
      </label>

      <textarea
        id="joinReason"
        name="reason"
        maxlength="500"
        placeholder="Tell us briefly..."
      ></textarea>


      <label for="joinCategory">
        Your Interest
      </label>

      <select
        id="joinCategory"
        name="category"
      >

        <option value="Shayari">
          Shayari
        </option>

        <option value="Writing">
          Writing
        </option>

        <option value="Stories">
          Stories
        </option>

        <option value="Creativity">
          Creativity
        </option>

        <option value="Other">
          Other
        </option>

      </select>


      <label
        style="
          display:flex;
          gap:10px;
          align-items:flex-start;
          margin:10px 0 18px;
        "
      >

        <input
          id="joinAgree"
          type="checkbox"
          required
          style="
            width:auto;
            margin-top:5px;
          "
        >

        <span>
          I confirm that the information provided
          by me is correct.
        </span>

      </label>


      <button
        class="btn"
        type="submit"
      >
        🚀 Submit Joining Request
      </button>

    </form>


    <div id="joinResult"></div>

  </div>

</main>


<script>

"use strict";


const joinForm =
  document.getElementById(
    "joinForm"
  );

const joinResult =
  document.getElementById(
    "joinResult"
  );


joinForm.addEventListener(
  "submit",
  function (event) {

    event.preventDefault();


    const name =
      document.getElementById(
        "joinName"
      ).value.trim();


    const email =
      document.getElementById(
        "joinEmail"
      ).value.trim();


    const reason =
      document.getElementById(
        "joinReason"
      ).value.trim();


    const category =
      document.getElementById(
        "joinCategory"
      ).value;


    if (
      name.length < 2 ||
      email.length < 5
    ) {

      joinResult.innerHTML = `
        <p class="status rejected">
          Please enter valid details.
        </p>
      `;

      return;

    }


    try {

      const request =
        ARS_STORAGE.saveJoin({

          name: name,

          email: email,

          reason: reason,

          category: category

        });


      joinResult.innerHTML = `

        <div class="panel-card">

          <h2 class="status approved">
            ✅ Request Submitted
          </h2>

          <p>
            Thank you,
            <strong>
              ${escapeHTML(name)}
            </strong>.
          </p>

          <p>
            Your request has been submitted
            for ARS approval.
          </p>

          <p>
            <strong>
              Your Request ID:
            </strong>
          </p>

          <p>
            <code>
              ${escapeHTML(request.id)}
            </code>
          </p>

          <p>
            Save this ID. You can use it to
            check your approval status.
          </p>

          <div class="card-actions">

            <a
              class="btn"
              href="verify.html?id=${encodeURIComponent(
                request.id
              )}"
            >
              🔎 Check Status
            </a>

          </div>

        </div>

      `;


      joinForm.reset();


    } catch (error) {

      console.error(error);

      joinResult.innerHTML = `
        <p class="status rejected">
          ❌ Something went wrong.
          Please try again.
        </p>
      `;

    }

  }
);


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}

</script>

</body>
</html>
