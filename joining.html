<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Join ARS — Adarsh Raj Shayar
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="config.js"></script>
  <script src="storage.js"></script>

</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <header class="site-header">

    <nav class="navbar">

      <a
        href="index.html"
        class="logo"
      >
        🌹 ARS Official
      </a>

      <div class="nav-links">

        <a href="index.html">
          Home
        </a>

        <a href="certificate.html">
          Certificate
        </a>

        <a href="joining.html"
           class="active">
          Join ARS
        </a>

        <a href="verify.html">
          Verify
        </a>

        <a href="publisher.html">
          Publisher
        </a>

      </div>

    </nav>

  </header>


  <!-- =========================
       MAIN
       ========================= -->

  <main>

    <section class="section">

      <div class="form-card joining-card">

        <div class="joining-icon">
          🤝
        </div>

        <h1>
          Join ARS
        </h1>

        <p>
          Become a part of the ARS community.
          Submit your details and wait for
          official approval.
        </p>


        <!-- FORM -->

        <form id="joinForm">

          <label for="jname">
            Full Name
          </label>

          <input
            id="jname"
            name="name"
            type="text"
            required
            autocomplete="name"
            placeholder="Enter your full name"
          >


          <label for="jemail">
            Email Address
          </label>

          <input
            id="jemail"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="Enter your email"
          >


          <label for="jreason">
            Why do you want to join ARS?
          </label>

          <textarea
            id="jreason"
            name="reason"
            rows="5"
            placeholder="Write a short message..."
          ></textarea>


          <button
            type="submit"
            class="btn"
          >
            Submit Joining Request
          </button>

        </form>


        <!-- RESULT -->

        <div
          id="joinResult"
          class="join-result"
        ></div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
       ========================= -->

  <footer class="site-footer">

    <p>
      ©
      <span id="year"></span>
      Adarsh Raj Shayar — ARS Official
    </p>

  </footer>


  <!-- =========================
       SCRIPT
       ========================= -->

  <script>

    const joinForm =
      document.getElementById(
        "joinForm"
      );

    const joinResult =
      document.getElementById(
        "joinResult"
      );

    const year =
      document.getElementById(
        "year"
      );

    year.textContent =
      new Date().getFullYear();


    joinForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        const name =
          document.getElementById(
            "jname"
          ).value.trim();

        const email =
          document.getElementById(
            "jemail"
          ).value.trim();

        const reason =
          document.getElementById(
            "jreason"
          ).value.trim();


        if (!name || !email) {

          joinResult.innerHTML = `
            <div class="panel-card">
              <p class="status rejected">
                ❌ Please enter your name and email.
              </p>
            </div>
          `;

          return;

        }


        try {

          const request =
            window.ARS_STORAGE
              .saveJoinRequest({

                name,
                email,
                reason

              });


          joinResult.innerHTML = `

            <div class="panel-card">

              <h2>
                ✅ Request Submitted
              </h2>

              <p>
                Thank you,
                <strong>
                  ${name}
                </strong>.
              </p>

              <p>
                Your ARS joining request has
                been submitted successfully.
              </p>

              <p>
                <strong>
                  Request ID:
                </strong>
                <br>
                ${request.id}
              </p>

              <p class="status pending">
                ⏳ Status: Pending Approval
              </p>

              <p>
                Save your Request ID.
                You can use it on the
                verification page to check
                your status.
              </p>

              <div
                style="
                  display:flex;
                  gap:10px;
                  flex-wrap:wrap;
                  margin-top:15px;
                "
              >

                <a
                  class="btn"
                  href="verify.html?id=${encodeURIComponent(
                    request.id
                  )}"
                >
                  🔎 Check Status
                </a>

                <a
                  class="btn"
                  href="index.html"
                >
                  🏠 Back Home
                </a>

              </div>

            </div>

          `;

          joinForm.reset();

        } catch (error) {

          console.error(
            "ARS Joining Error:",
            error
          );

          joinResult.innerHTML = `

            <div class="panel-card">

              <p class="status rejected">
                ❌ Something went wrong.
                Please try again.
              </p>

            </div>

          `;

        }

      }
    );

  </script>

</body>

</html>
