<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Join ARS Official</title>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>

</head>


<body>


<header class="site-header">

  <nav class="navbar">

    <a class="brand" href="index.html">

      <img
        class="brand-logo"
        src="logo.png"
        alt="ARS Logo"
      >

      <span>

        <strong>ARS Official</strong>

        <small>Adarsh Raj Shayar</small>

      </span>

    </a>


    <div class="nav-links">

      <a href="index.html">Home</a>

      <a class="active" href="joining.html">
        Join ARS
      </a>

      <a href="certificate.html">
        Certificate
      </a>

      <a href="verify.html">
        Verify
      </a>

      <a href="founder.html">
        Founder
      </a>

    </div>

  </nav>

</header>


<main>

<section class="section">

  <div class="section-heading">

    <span>ARS COMMUNITY</span>

    <h2>ARS से जुड़ें</h2>

    <p>
      Writer, Creator, Supporter या किसी अन्य
      interest के साथ ARS community का हिस्सा बनें।
    </p>

  </div>


  <div class="form-card">

    <form id="joiningForm">

      <div class="form-row">

        <div class="form-group">

          <label for="joinName">
            Name / नाम
          </label>

          <input
            id="joinName"
            required
            placeholder="आपका नाम"
          >

        </div>


        <div class="form-group">

          <label for="joinEmail">
            Email
          </label>

          <input
            id="joinEmail"
            type="email"
            required
            placeholder="your@email.com"
          >

        </div>

      </div>


      <div class="form-row">

        <div class="form-group">

          <label for="joinAge">
            Age / उम्र
          </label>

          <input
            id="joinAge"
            type="number"
            min="1"
            max="120"
            required
          >

        </div>


        <div class="form-group">

          <label for="joinInterest">
            Interest / रुचि
          </label>

          <select id="joinInterest" required>

            <option value="">
              Select Interest
            </option>

            <option>Writer</option>
            <option>Creator</option>
            <option>Supporter</option>
            <option>Shayar</option>
            <option>Instagram</option>
            <option>YouTube</option>
            <option>Other</option>

          </select>

        </div>

      </div>


      <div class="form-group">

        <label for="joinSocial">
          Instagram / YouTube / Social Link
        </label>

        <input
          id="joinSocial"
          type="url"
          placeholder="https://..."
        >

      </div>


      <div class="form-group">

        <label for="joinMessage">
          About You / Message
        </label>

        <textarea
          id="joinMessage"
          placeholder="अपने बारे में थोड़ा बताइए..."
        ></textarea>

      </div>


      <button
        class="primary-btn"
        type="submit"
      >
        🚀 Submit Joining Request
      </button>

    </form>


    <div
      id="joinResult"
      style="margin-top:20px;"
    ></div>

  </div>

</section>

</main>


<footer class="site-footer">

  <div class="footer-inner">

    <div class="footer-brand">

      <img src="logo.png" alt="ARS Logo">

      <div>

        <h3>Adarsh Raj Shayar</h3>

        <p>
          ARS Official Community
        </p>

      </div>

    </div>

  </div>

</footer>


<script>

(function () {

  "use strict";


  const form =
    document.getElementById("joiningForm");


  const result =
    document.getElementById("joinResult");


  form.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();


      const request = {

        id:
          "ARS-JOIN-" +
          Date.now(),

        name:
          document
            .getElementById("joinName")
            .value.trim(),

        email:
          document
            .getElementById("joinEmail")
            .value.trim(),

        age:
          document
            .getElementById("joinAge")
            .value,

        interest:
          document
            .getElementById("joinInterest")
            .value,

        social:
          document
            .getElementById("joinSocial")
            .value.trim(),

        message:
          document
            .getElementById("joinMessage")
            .value.trim(),

        status:
          "Pending",

        createdAt:
          new Date().toISOString()

      };


      if (window.ARSStorage) {

        window.ARSStorage.saveJoinRequest(
          request
        );

      }


      result.innerHTML = `

        <div class="empty-state">

          <div>✅</div>

          <h3>
            Joining Request Submitted
          </h3>

          <p>
            आपका ARS joining request successfully
            submit हो गया है।
          </p>

          <p>
            Request ID:
            <strong>${request.id}</strong>
          </p>

        </div>

      `;


      form.reset();

    }
  );

})();

</script>


</body>
</html>
