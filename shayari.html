<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shayari | ARS Official</title>
  <meta
    name="description"
    content="Read original Shayari by ARS Official."
  >

  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="script.js" defer></script>

  <style>
    .shayari-page {
      padding: 50px 20px 75px;
      background:
        radial-gradient(circle at top left, rgba(110,168,254,.11), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,120,160,.10), transparent 30%);
      min-height: calc(100vh - 80px);
    }

    .shayari-header {
      max-width: 850px;
      margin: 0 auto 32px;
      text-align: center;
    }

    .shayari-header .eyebrow {
      color: #635bff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .shayari-header p {
      color: #667085;
      line-height: 1.7;
    }

    .category-bar {
      max-width: 1100px;
      margin: 0 auto 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .category-btn {
      border: 1px solid #dfe4ed;
      background: #fff;
      color: #344054;
      padding: 9px 15px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      transition: .2s ease;
    }

    .category-btn:hover,
    .category-btn.active {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #4776e6, #c44cff);
    }

    .shayari-grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .shayari-card {
      background: #fff;
      border: 1px solid #edf0f5;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(50,70,120,.06);
      transition: .2s ease;
    }

    .shayari-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(50,70,120,.10);
    }

    .shayari-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 17px;
    }

    .shayari-category {
      color: #635bff;
      background: #f3f1ff;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
    }

    .shayari-number {
      color: #98a2b3;
      font-size: 12px;
    }

    .shayari-text {
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #344054;
      font-size: 17px;
      line-height: 2;
      white-space: pre-line;
    }

    .shayari-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #eef0f4;
    }

    .shayari-action {
      border: 1px solid #e1e5ec;
      background: #fff;
      color: #475467;
      border-radius: 10px;
      padding: 8px 11px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .shayari-action:hover,
    .shayari-action.active {
      color: #635bff;
      border-color: #cfd5ff;
      background: #f7f6ff;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: #fff;
      border-radius: 20px;
      padding: 45px 20px;
      text-align: center;
      color: #667085;
    }

    @media (max-width: 900px) {
      .shayari-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .shayari-grid {
        grid-template-columns: 1fr;
      }

      .shayari-card {
        padding: 21px;
      }
    }
  </style>
</head>

<body>

  <div id="pageLoader" class="page-loader">
    <div class="loader-spinner"></div>
  </div>

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="brand">
        <span class="brand-mark">🌹</span>
        <span>
          <strong>ARS</strong>
          <small>Official</small>
        </span>
      </a>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="shayari.html">Shayari</a>
        <a href="stories.html">Stories</a>
        <a href="education.html">Education</a>
        <a href="ars-book.html">ARS Book</a>
      </nav>

      <div class="header-actions">
        <a href="dashboard.html" class="btn btn-primary">
          Dashboard
        </a>
      </div>

    </div>
  </header>

  <main class="shayari-page">

    <section class="shayari-header">

      <div class="eyebrow">
        ARS Creative Collection
      </div>

      <h1>Shayari</h1>

      <p>
        ARS की original shayari collection पढ़ें, पसंद करें,
        favorite करें और अपने दोस्तों के साथ share करें।
      </p>

    </section>

    <div class="category-bar" id="categoryBar"></div>

    <section
      class="shayari-grid"
      id="shayariGrid"
      aria-live="polite"
    ></section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        © <span id="footerYear"></span>
        ARS Official. All Rights Reserved.
      </p>
    </div>
  </footer>

  <script>
    const SHAYARI_DATA = [

      {
        id: "shayari-001",
        category: "Motivational",
        text:
`रास्ते मुश्किल हों तो हिम्मत मत हारना,
हर गिरावट के बाद फिर से सँभलना।
मंज़िल उन्हीं को मिलती है आखिर,
जो रुककर भी फिर चलना सीखते हैं।`
      },

      {
        id: "shayari-002",
        category: "Love",
        text:
`तेरी यादों का रंग कुछ ऐसा है,
हर पल दिल के पास रहता है।
दूर होकर भी तू दूर नहीं,
नाम तेरा दिल में खास रहता है।`
      },

      {
        id: "shayari-003",
        category: "Sad",
        text:
`कुछ बातें शब्दों में कही नहीं जातीं,
कुछ यादें दिल से मिटाई नहीं जातीं।
समय गुजर जाता है चुपचाप मगर,
कुछ कमी कभी पूरी नहीं हो पाती।`
      },

      {
        id: "shayari-004",
        category: "Friendship",
        text:
`दोस्ती वो नहीं जो वक्त के साथ बदल जाए,
दोस्ती वो है जो मुश्किल में साथ निभाए।
हँसी के पल तो हर कोई बाँट लेता है,
सच्चा दोस्त आँसू में भी पास आए।`
      },

      {
        id: "shayari-005",
        category: "Attitude",
        text:
`अपनी पहचान किसी नाम की मोहताज नहीं,
मेहनत से बड़ी कोई बात नहीं।
जो आज हमें छोटा समझते हैं,
कल उन्हें जवाब देने की जरूरत नहीं।`
      },

      {
        id: "shayari-006",
        category: "Motivational",
        text:
`आज की मेहनत कल की पहचान बनेगी,
छोटी सी कोशिश बड़ी उड़ान बनेगी।
बस खुद पर भरोसा बनाए रखना,
एक दिन यही मेहनत तेरी शान बनेगी।`
      },

      {
        id: "shayari-007",
        category: "Teachers Shayari",
        text:
`ज्ञान की राह दिखाने वाले,
अँधियारे में दीप जलाने वाले।
गुरु का सम्मान शब्दों से बढ़कर,
वो जीवन को सही दिशा देने वाले।`
      },

      {
        id: "shayari-008",
        category: "Love",
        text:
`कुछ रिश्ते नाम से नहीं दिल से बनते हैं,
कुछ लोग यादों में हर पल रहते हैं।
दूरी चाहे जितनी भी हो जाए,
सच्चे एहसास कहाँ कभी कम होते हैं।`
      },

      {
        id: "shayari-009",
        category: "Friendship",
        text:
`साथ चलने वाले बहुत मिल जाते हैं,
दिल समझने वाले कम मिल पाते हैं।
जिस दोस्ती में भरोसा जिंदा रहे,
वही रिश्ते उम्र भर याद आते हैं।`
      },

      {
        id: "shayari-010",
        category: "Attitude",
        text:
`खुद को साबित करने की जल्दी नहीं,
समय सबका हिसाब रखता है।
हम अपने रास्ते पर चलते हैं,
क्योंकि भरोसा खुद पर रहता है।`
      }

    ];

    const categories = [
      "All",
      "Love",
      "Sad",
      "Motivational",
      "Friendship",
      "Attitude",
      "Teachers Shayari"
    ];

    let selectedCategory = "All";

    const categoryBar =
      document.getElementById("categoryBar");

    const grid =
      document.getElementById("shayariGrid");

    function renderCategories() {

      categoryBar.innerHTML = "";

      categories.forEach(category => {

        const button =
          document.createElement("button");

        button.type = "button";
        button.className =
          "category-btn" +
          (category === selectedCategory
            ? " active"
            : "");

        button.textContent = category;

        button.addEventListener("click", () => {

          selectedCategory = category;

          renderCategories();
          renderShayari();

        });

        categoryBar.appendChild(button);

      });

    }

    function renderShayari() {

      const filtered =
        selectedCategory === "All"
          ? SHAYARI_DATA
          : SHAYARI_DATA.filter(
              item =>
                item.category === selectedCategory
            );

      if (!filtered.length) {

        grid.innerHTML = `
          <div class="empty-state">
            इस category में अभी कोई shayari उपलब्ध नहीं है।
          </div>
        `;

        return;
      }

      grid.innerHTML = "";

      filtered.forEach((item, index) => {

        const card =
          document.createElement("article");

        card.className = "shayari-card";

        card.innerHTML = `
          <div class="shayari-top">
            <span class="shayari-category">
              ${escapeHTML(item.category)}
            </span>

            <span class="shayari-number">
              #${String(index + 1).padStart(2, "0")}
            </span>
          </div>

          <div class="shayari-text">
            ${escapeHTML(item.text)}
          </div>

          <div class="shayari-actions">

            <button
              type="button"
              class="shayari-action"
              data-like-id="${item.id}"
            >
              ❤️ Like
            </button>

            <button
              type="button"
              class="shayari-action"
              data-favorite-id="${item.id}"
            >
              ⭐ Favorite
            </button>

            <button
              type="button"
              class="shayari-action copy-shayari"
              data-copy-text="${escapeAttribute(item.text)}"
            >
              📋 Copy
            </button>

          </div>
        `;

        grid.appendChild(card);

      });

      setupShayariActions();

    }

    function setupShayariActions() {

      if (!window.ARS_STORAGE) {
        return;
      }

      grid
        .querySelectorAll("[data-like-id]")
        .forEach(button => {

          const id =
            button.dataset.likeId;

          updateLike(button, id);

          button.addEventListener("click", () => {

            const result =
              window.ARS_STORAGE.toggleLike(id);

            updateLike(button, id);

            if (window.arsToast) {
              window.arsToast(
                result.active
                  ? "Shayari liked ❤️"
                  : "Like removed",
                "success"
              );
            }

          });

        });

      grid
        .querySelectorAll("[data-favorite-id]")
        .forEach(button => {

          const id =
            button.dataset.favoriteId;

          updateFavorite(button, id);

          button.addEventListener("click", () => {

            const result =
              window.ARS_STORAGE.toggleFavorite(id);

            updateFavorite(button, id);

            if (window.arsToast) {
              window.arsToast(
                result.active
                  ? "Favorite में जोड़ दिया गया ⭐"
                  : "Favorite से हटा दिया गया",
                "success"
              );
            }

          });

        });

      grid
        .querySelectorAll(".copy-shayari")
        .forEach(button => {

          button.addEventListener("click", async () => {

            try {

              await navigator.clipboard.writeText(
                button.dataset.copyText
              );

              if (window.arsToast) {
                window.arsToast(
                  "Shayari copied 📋",
                  "success"
                );
              }

            } catch (error) {

              console.error(error);

            }

          });

        });

    }

    function updateLike(button, id) {

      const active =
        window.ARS_STORAGE.hasLiked(id);

      button.classList.toggle(
        "active",
        active
      );

      button.textContent =
        active
          ? "❤️ Liked"
          : "❤️ Like";

    }

    function updateFavorite(button, id) {

      const active =
        window.ARS_STORAGE.isFavorite(id);

      button.classList.toggle(
        "active",
        active
      );

      button.textContent =
        active
          ? "⭐ Favorited"
          : "⭐ Favorite";

    }

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function escapeAttribute(value) {
      return escapeHTML(value)
        .replace(/\n/g, "&#10;")
        .replace(/\r/g, "&#13;");
    }

    document.addEventListener("DOMContentLoaded", () => {

      document.getElementById("footerYear").textContent =
        new Date().getFullYear();

      renderCategories();
      renderShayari();

    });
  </script>

</body>
</html>
