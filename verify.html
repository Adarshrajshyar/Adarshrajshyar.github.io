<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verify ARS Certificate</title>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>
</head>

<body>

<header class="site-header">
  <nav class="navbar">

    <a class="logo" href="index.html">
      🌹 ARS Official
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="joining.html">Join ARS</a>
      <a href="certificate.html">Certificate</a>
      <a href="verify.html">Verify</a>
    </div>

  </nav>
</header>

<main class="section">

  <div class="form-card">

    <h1>🔎 Verify ARS</h1>

    <p>
      Verify an ARS certificate or joining request using its ID.
    </p>

    <form id="verifyForm">

      <input
        id="verifyId"
        type="text"
        required
        placeholder="Enter Certificate / Joining ID"
        autocomplete="off"
      >

      <button class="btn" type="submit">
        Verify
      </button>

    </form>

    <div id="verifyResult"></div>

  </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("verifyForm");
  const input = document.getElementById("verifyId");
  const result = document.getElementById("verifyResult");

  const urlId =
    new URLSearchParams(window.location.search).get("id");

  if (urlId) {
    input.value = urlId;
    verifyRecord(urlId);
  }

  form.addEventListener("submit", function (event) {

    event.preventDefault();

    verifyRecord(input.value.trim());

  });

  function verifyRecord(id) {

    if (!id) {
      result.innerHTML =
        '<p class="status rejected">Please enter an ID.</p>';
      return;
    }

    const certificate =
      ARS_STORAGE.findCertificate(id);

    if (certificate) {

      result.innerHTML = `
        <div class="panel-card">

          <h2 class="status approved">
            ✅ Certificate Verified
          </h2>

          <p>
            <b>Name:</b>
            ${escapeHtml(certificate.name)}
          </p>

          <p>
            <b>Certificate Type:</b>
            ${escapeHtml(certificate.type)}
          </p>

          <p>
            <b>Certificate ID:</b>
            ${escapeHtml(certificate.id)}
          </p>

          <p>
            <b>Status:</b>
            <span class="status approved">
              Approved / Valid
            </span>
          </p>

          <p>
            <b>Issued By:</b>
            Adarsh Raj — Founder, ARS
          </p>

          <p>
            <b>Issued Date:</b>
            ${new Date(certificate.issuedAt).toLocaleDateString()}
          </p>

        </div>
      `;

      return;
    }

    const joiningRequest =
      ARS_STORAGE.joins().find(
        item =>
          String(item.id).toLowerCase() ===
          String(id).toLowerCase()
      );

    if (joiningRequest) {

      result.innerHTML = `
        <div class="panel-card">

          <h2>🤝 ARS Joining Request</h2>

          <p>
            <b>Name:</b>
            ${escapeHtml(joiningRequest.name)}
          </p>

          <p>
            <b>Joining ID:</b>
            ${escapeHtml(joiningRequest.id)}
          </p>

          <p>
            <b>Status:</b>
            <span class="status ${joiningRequest.status}">
              ${escapeHtml(joiningRequest.status)}
            </span>
          </p>

          ${
            joiningRequest.status === "approved"
              ? `
                <p class="status approved">
                  ✅ Your ARS joining request is approved.
                </p>

                <a
                  class="btn"
                  href="joining-certificate.html?id=${encodeURIComponent(joiningRequest.id)}"
                >
                  View Joining Certificate
                </a>
              `
              : `
                <p>
                  Your certificate will become available
                  after ARS approval.
                </p>
              `
          }

        </div>
      `;

      return;
    }

    result.innerHTML = `
      <div class="panel-card">
        <h2 class="status rejected">
          ❌ Record Not Found
        </h2>
        <p>
          No ARS certificate or joining record was found
          with this ID.
        </p>
      </div>
    `;
  }

  function escapeHtml(value) {

    const div = document.createElement("div");

    div.textContent = value ?? "";

    return div.innerHTML;
  }

});
</script>

</body>
</html>
