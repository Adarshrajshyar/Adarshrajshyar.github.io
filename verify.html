<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ARS Certificate Verification</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .verify-page {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    .verify-card {
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow:
        0 8px 30px rgba(0,0,0,.08);
    }

    .verify-card input {
      width: 100%;
      padding: 13px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin: 10px 0;
    }

    .verify-btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .verify-result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 14px;
      background: #f8fafc;
    }

    .verified {
      color: #15803d;
    }

    .not-verified {
      color: #b91c1c;
    }

  </style>

</head>

<body>

<header class="site-header">

  <nav class="navbar">

    <a href="index.html" class="logo">
      🌹 ARS
    </a>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="joining.html">
        Join ARS
      </a>

      <a href="certificate.html">
        Certificate
      </a>

      <a href="verify.html">
        Verify
      </a>

    </div>

  </nav>

</header>


<main class="verify-page">

  <section class="verify-card">

    <h1>
      🔎 Verify ARS Certificate
    </h1>

    <p>
      Enter your Certificate ID or Joining Request ID.
    </p>


    <form id="verifyForm">

      <input
        id="verifyId"
        placeholder="Example: ARS-CERT-XXXX"
        required
      >

      <button
        class="verify-btn"
        type="submit"
      >
        Verify
      </button>

    </form>


    <div
      id="verifyResult"
      class="verify-result"
    ></div>

  </section>

</main>


<script src="config.js"></script>
<script src="storage.js"></script>

<script>

  const params =
    new URLSearchParams(
      window.location.search
    );

  const urlId =
    params.get("id");

  if (urlId) {

    document.getElementById(
      "verifyId"
    ).value = urlId;

    verify(urlId);

  }


  document
    .getElementById("verifyForm")
    .addEventListener(
      "submit",
      function(e) {

        e.preventDefault();

        verify(
          document
            .getElementById(
              "verifyId"
            )
            .value
            .trim()
        );

      }
    );


  function verify(id) {

    const result =
      document.getElementById(
        "verifyResult"
      );

    if (!id) {

      result.innerHTML =
        "<p class='not-verified'>❌ Please enter an ID.</p>";

      return;
    }


    const certificate =
      window.ARS_STORAGE
        .findCertificate(id);


    if (certificate) {

      result.innerHTML = `

        <h2 class="verified">
          ✅ Certificate Verified
        </h2>

        <p>
          <strong>Name:</strong>
          ${escapeHTML(
            certificate.name
          )}
        </p>

        <p>
          <strong>Certificate Type:</strong>
          ${escapeHTML(
            certificate.type
          )}
        </p>

        <p>
          <strong>Certificate ID:</strong>
          ${escapeHTML(
            certificate.id
          )}
        </p>

        <p>
          <strong>Issued By:</strong>
          Adarsh Raj
        </p>

      `;

      return;
    }


    const requests =
      window.ARS_STORAGE
        .getJoiningRequests();

    const request =
      requests.find(
        item =>
          String(item.id).toLowerCase() ===
          String(id).toLowerCase()
      );


    if (request) {

      const status =
        request.status ||
        "pending";

      result.innerHTML = `

        <h2>
          🤝 ARS Joining Request
        </h2>

        <p>
          <strong>Name:</strong>
          ${escapeHTML(
            request.name
          )}
        </p>

        <p>
          <strong>Request ID:</strong>
          ${escapeHTML(
            request.id
          )}
        </p>

        <p>
          <strong>Status:</strong>
          ${escapeHTML(
            status
          )}
        </p>

        ${
          status === "approved"
            ? `
              <p class="verified">
                ✅ Your joining request has been approved.
              </p>
            `
            : status === "rejected"
              ? `
                <p class="not-verified">
                  ❌ Your joining request was rejected.
                </p>
              `
              : `
                <p>
                  ⏳ Your joining request is waiting
                  for admin approval.
                </p>
              `
        }

      `;

      return;
    }


    result.innerHTML = `

      <h2 class="not-verified">
        ❌ Not Found
      </h2>

      <p>
        No ARS certificate or joining request
        was found with this ID.
      </p>

    `;

  }


  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value == null ? "" : value;

    return div.innerHTML;

  }

</script>

</body>
</html>
