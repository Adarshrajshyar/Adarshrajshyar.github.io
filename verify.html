<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ARS Certificate Verification
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="config.js"></script>

  <script src="storage.js"></script>

</head>


<body>


<header class="site-header">

  <nav class="navbar">

    <a
      class="logo"
      href="index.html"
    >

      <img
        src="logo.png"
        alt="ARS Logo"
      >

      <span>
        ARS Official
      </span>

    </a>


    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="joining.html">
        Join ARS
      </a>

      <a href="certificate.html">
        Certificate
      </a>

      <a
        class="active"
        href="verify.html"
      >
        Verify
      </a>

      <a href="founder.html">
        Founder
      </a>

    </div>

  </nav>

</header>



<main class="verification-page">


  <section class="page-heading">

    <span class="eyebrow">
      ARS OFFICIAL
    </span>


    <h1>
      🔎 Certificate Verification
    </h1>


    <p>

      अपने ARS Certificate की सत्यता जाँचें।

      <br>

      Verify an ARS Certificate using its unique ID.

    </p>

  </section>



  <section class="verification-card">


    <form
      id="verificationForm"
      autocomplete="off"
    >


      <label for="verificationID">

        Certificate ID / प्रमाणपत्र ID

      </label>


      <div class="verification-input-row">

        <input
          type="text"
          id="verificationID"
          placeholder="ARS-CERT-2026-XXXXXX"
          required
        >


        <button
          type="submit"
          class="btn"
        >

          🔎 Verify

        </button>

      </div>


    </form>


    <div
      id="verificationResult"
      class="verification-result"
      aria-live="polite"
    ></div>


  </section>


</main>



<footer class="site-footer">

  <div class="footer-inner">

    <img
      src="logo.png"
      alt="ARS Logo"
    >


    <div>

      <strong>
        Adarsh Raj Shayar
      </strong>


      <p>
        ARS Official — Certificate Verification
      </p>

    </div>

  </div>

</footer>



<script>

(function () {

  "use strict";


  const form =
    document.getElementById(
      "verificationForm"
    );


  const input =
    document.getElementById(
      "verificationID"
    );


  const result =
    document.getElementById(
      "verificationResult"
    );


  /* -------------------------------------------------------
     AUTO READ QR URL
     ------------------------------------------------------- */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const urlID =
    params.get("id");


  if (urlID) {

    input.value = urlID;

    verify(urlID);

  }


  /* -------------------------------------------------------
     VERIFY
     ------------------------------------------------------- */

  function verify(id) {

    const cleanID =
      String(id || "")
        .trim();


    if (!cleanID) {

      showError(
        "कृपया Certificate ID दर्ज करें।"
      );

      return;

    }


    let certificate = null;


    /* Main certificate engine */

    if (
      window.ARS_CERTIFICATE &&
      typeof window.ARS_CERTIFICATE.find === "function"
    ) {

      certificate =
        window.ARS_CERTIFICATE.find(
          cleanID
        );

    }


    /* Storage fallback */

    if (!certificate) {

      try {

        const data =
          JSON.parse(
            localStorage.getItem(
              "ARS_CERTIFICATES"
            ) || "[]"
          );


        certificate =
          data.find(
            item =>
              String(item.id)
                .toLowerCase() ===
              cleanID.toLowerCase()
          ) || null;

      } catch (error) {

        console.error(error);

      }

    }


    if (!certificate) {

      showError(
        "यह Certificate ID ARS रिकॉर्ड में नहीं मिली। कृपया ID दोबारा जाँचें।"
      );

      return;

    }


    showCertificate(
      certificate
    );

  }


  /* -------------------------------------------------------
     SUCCESS RESULT
     ------------------------------------------------------- */

  function showCertificate(certificate) {

    const date =
      new Date(
        certificate.issuedAt
      );


    const formattedDate =
      Number.isNaN(date.getTime())
        ? "—"
        : date.toLocaleDateString(
            "en-IN",
            {
              day: "2-digit",
              month: "long",
              year: "numeric"
            }
          );


    result.innerHTML = `

      <div class="verification-success">


        <div class="verification-icon">

          ✓

        </div>


        <h2>

          Certificate Verified

        </h2>


        <p class="verification-hindi">

          ✅ यह प्रमाणपत्र ARS Official के रिकॉर्ड में
          सफलतापूर्वक सत्यापित है।

        </p>


        <div class="verified-details">


          <div>

            <span>
              Name / नाम
            </span>

            <strong>
              ${escapeHTML(
                certificate.name
              )}
            </strong>

          </div>


          <div>

            <span>
              Certificate Type
            </span>

            <strong>
              ${escapeHTML(
                certificate.type
              )}
            </strong>

          </div>


          <div>

            <span>
              Certificate ID
            </span>

            <strong>
              ${escapeHTML(
                certificate.id
              )}
            </strong>

          </div>


          <div>

            <span>
              Issue Date
            </span>

            <strong>
              ${formattedDate}
            </strong>

          </div>


          <div>

            <span>
              Issued By
            </span>

            <strong>
              Adarsh Raj — Founder, ARS Official
            </strong>

          </div>


          ${
            certificate.type === "Business"
              ? `

                <div>

                  <span>
                    Business Name
                  </span>

                  <strong>
                    ${escapeHTML(
                      certificate.businessName
                    )}
                  </strong>

                </div>


                <div>

                  <span>
                    Owner / Founder
                  </span>

                  <strong>
                    ${escapeHTML(
                      certificate.businessOwner
                    )}
                  </strong>

                </div>

              `
              : ""
          }


        </div>


        <div class="verified-badge">

          ✓ VERIFIED ARS CERTIFICATE

        </div>


      </div>

    `;

  }


  /* -------------------------------------------------------
     ERROR
     ------------------------------------------------------- */

  function showError(message) {

    result.innerHTML = `

      <div class="verification-error">

        <div class="verification-error-icon">
          !
        </div>


        <h2>
          Certificate Not Found
        </h2>


        <p>
          ${escapeHTML(message)}
        </p>


        <small>
          कृपया Certificate ID सही तरीके से दर्ज करें।
        </small>

      </div>

    `;

  }


  /* -------------------------------------------------------
     SAFE HTML
     ------------------------------------------------------- */

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value ?? "";

    return div.innerHTML;

  }


  /* -------------------------------------------------------
     FORM
     ------------------------------------------------------- */

  form.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

      verify(
        input.value
      );

    }
  );


})();

</script>


</body>

</html>
