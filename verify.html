<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARS Certificate Verification</title>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>

  <style>
    .verification-page {
      width: min(900px, calc(100% - 30px));
      margin: auto;
      padding: 90px 0;
    }

    .page-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .page-heading .eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .page-heading h1 {
      margin: 8px 0;
      font-size: clamp(30px, 5vw, 46px);
      color: var(--dark);
    }

    .page-heading p {
      color: var(--muted);
      margin: 0;
    }

    .verification-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow-md);
    }

    .verification-card label {
      display: block;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .verification-input-row {
      display: flex;
      gap: 10px;
    }

    .verification-input-row input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .verification-input-row input:focus {
      border-color: var(--primary);
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .verification-result {
      margin-top: 25px;
    }

    .verification-success,
    .verification-error {
      padding: 28px;
      border-radius: 18px;
      text-align: center;
    }

    .verification-success {
      background: #f5fbf7;
      border: 1px solid #d8eadf;
    }

    .verification-error {
      background: #fff6f6;
      border: 1px solid #f0d5d5;
    }

    .verification-icon,
    .verification-error-icon {
      width: 55px;
      height: 55px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 25px;
      font-weight: 900;
    }

    .verification-icon {
      background: #dff3e5;
      color: #218642;
    }

    .verification-error-icon {
      background: #f8dddd;
      color: #a52c2c;
    }

    .verification-success h2,
    .verification-error h2 {
      margin: 15px 0 7px;
    }

    .verification-hindi {
      color: #3d694b;
    }

    .verified-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 22px;
      text-align: left;
    }

    .verified-details div {
      padding: 15px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .verified-details span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .verified-details strong {
      word-break: break-word;
    }

    .verified-badge {
      display: inline-block;
      margin-top: 22px;
      padding: 9px 15px;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 900;
    }

    @media (max-width: 600px) {
      .verification-input-row {
        flex-direction: column;
      }

      .verified-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <nav class="navbar">

    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="ARS Official Logo">
      <span>
        <strong>ARS Official</strong>
        <small>Adarsh Raj Shayar</small>
      </span>
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="joining.html">Join ARS</a>
      <a href="certificate.html">Certificate</a>
      <a class="active" href="verify.html">Verify</a>
      <a href="founder.html">Founder</a>
    </div>

  </nav>
</header>


<main class="verification-page">

  <section class="page-heading">

    <span class="eyebrow">ARS OFFICIAL</span>

    <h1>🔎 Certificate Verification</h1>

    <p>
      अपने ARS Certificate की सत्यता जाँचें।
      <br>
      Verify an ARS Certificate using its unique ID.
    </p>

  </section>


  <section class="verification-card">

    <form id="verificationForm" autocomplete="off">

      <label for="verificationID">
        Certificate ID / प्रमाणपत्र ID
      </label>

      <div class="verification-input-row">

        <input
          type="text"
          id="verificationID"
          placeholder="ARS-CERT-2026-XXXXXX"
          required
        >

        <button class="btn" type="submit">
          🔎 Verify
        </button>

      </div>

    </form>


    <div
      id="verificationResult"
      class="verification-result"
      aria-live="polite"
    ></div>

  </section>

</main>


<footer class="site-footer">

  <div class="footer-inner">

    <div class="footer-brand">
      <img src="logo.png" alt="ARS Logo">

      <div>
        <h3>Adarsh Raj Shayar</h3>
        <p>ARS Official — Certificate Verification</p>
      </div>
    </div>

  </div>

</footer>


<script>
(function () {

  "use strict";

  const form = document.getElementById("verificationForm");
  const input = document.getElementById("verificationID");
  const result = document.getElementById("verificationResult");


  function escapeHTML(value) {

    const div = document.createElement("div");

    div.textContent = value ?? "";

    return div.innerHTML;
  }


  function showError(message) {

    result.innerHTML = `
      <div class="verification-error">

        <div class="verification-error-icon">!</div>

        <h2>Certificate Not Found</h2>

        <p>${escapeHTML(message)}</p>

        <small>
          कृपया Certificate ID सही तरीके से दर्ज करें।
        </small>

      </div>
    `;
  }


  function verify(id) {

    const cleanID = String(id || "").trim();

    if (!cleanID) {

      showError("कृपया Certificate ID दर्ज करें।");

      return;
    }


    let certificate = null;


    if (
      window.ARS_CERTIFICATE &&
      typeof window.ARS_CERTIFICATE.find === "function"
    ) {

      certificate =
        window.ARS_CERTIFICATE.find(cleanID);

    }


    if (!certificate) {

      certificate =
        window.ARSStorage?.findCertificate(cleanID);
    }


    if (!certificate) {

      showError(
        "यह Certificate ID ARS रिकॉर्ड में नहीं मिली।"
      );

      return;
    }


    const date = new Date(certificate.issuedAt);

    const formattedDate =
      Number.isNaN(date.getTime())
        ? "—"
        : date.toLocaleDateString(
            "en-IN",
            {
              day: "2-digit",
              month: "long",
              year: "numeric"
            }
          );


    result.innerHTML = `

      <div class="verification-success">

        <div class="verification-icon">✓</div>

        <h2>Certificate Verified</h2>

        <p class="verification-hindi">
          ✅ यह प्रमाणपत्र ARS Official के रिकॉर्ड में
          सफलतापूर्वक सत्यापित है।
        </p>


        <div class="verified-details">

          <div>
            <span>Name / नाम</span>
            <strong>
              ${escapeHTML(certificate.name)}
            </strong>
          </div>


          <div>
            <span>Certificate Type</span>
            <strong>
              ${escapeHTML(certificate.type)}
            </strong>
          </div>


          <div>
            <span>Certificate ID</span>
            <strong>
              ${escapeHTML(certificate.id)}
            </strong>
          </div>


          <div>
            <span>Issue Date</span>
            <strong>
              ${formattedDate}
            </strong>
          </div>


          <div>
            <span>Issued By</span>
            <strong>
              Adarsh Raj — Founder, ARS Official
            </strong>
          </div>


          ${
            certificate.type === "Business"
              ? `

                <div>
                  <span>Business Name</span>
                  <strong>
                    ${escapeHTML(certificate.businessName)}
                  </strong>
                </div>

                <div>
                  <span>Owner / Founder</span>
                  <strong>
                    ${escapeHTML(certificate.businessOwner)}
                  </strong>
                </div>

              `
              : ""
          }

        </div>


        <div class="verified-badge">
          ✓ VERIFIED ARS CERTIFICATE
        </div>

      </div>
    `;
  }


  form.addEventListener("submit", function (event) {

    event.preventDefault();

    verify(input.value);

  });


  const urlID =
    new URLSearchParams(window.location.search).get("id");


  if (urlID) {

    input.value = urlID;

    verify(urlID);

  }

})();
</script>

</body>
</html>
