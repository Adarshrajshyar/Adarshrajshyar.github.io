<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Verify ARS Certificate</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="config.js"></script>
  <script src="storage.js"></script>

</head>

<body>

  <header class="site-header">

    <nav class="navbar">

      <a
        class="logo"
        href="index.html"
      >
        🌹 ARS Official
      </a>

      <div class="nav-links">

        <a href="index.html">
          Home
        </a>

        <a href="joining.html">
          Join ARS
        </a>

        <a href="certificate.html">
          Certificate
        </a>

        <a href="verify.html">
          Verify
        </a>

      </div>

    </nav>

  </header>


  <main class="section">

    <div class="form-card">

      <h1>
        🔎 Verify ARS
      </h1>

      <p>
        Enter a Certificate ID or Joining Request ID.
      </p>

      <form id="verifyForm">

        <input
          id="verifyId"
          type="text"
          required
          placeholder="ARS-CERT-XXXX or ARS-MEMBER-XXXX"
          autocomplete="off"
        >

        <button
          class="btn"
          type="submit"
        >
          Verify
        </button>

      </form>

    </div>


    <div id="verificationResult"></div>

  </main>


  <script>

    const verifyForm =
      document.getElementById("verifyForm");

    const verifyId =
      document.getElementById("verifyId");

    const verificationResult =
      document.getElementById(
        "verificationResult"
      );


    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value ?? "";

      return div.innerHTML;

    }


    function verifyRecord(id) {

      verificationResult.innerHTML = "";


      const certificate =
        ARS_STORAGE.findCertificate(id);


      if (certificate) {

        verificationResult.innerHTML = `

          <div class="panel-card">

            <h2 class="status approved">
              ✅ Certificate Verified
            </h2>

            <p>
              <strong>Name:</strong>
              ${escapeHTML(
                certificate.name
              )}
            </p>

            <p>
              <strong>Certificate Type:</strong>
              ${escapeHTML(
                certificate.type
              )}
            </p>

            <p>
              <strong>Certificate ID:</strong>
              ${escapeHTML(
                certificate.id
              )}
            </p>

            <p>
              <strong>Issued By:</strong>
              Adarsh Raj — Founder, ARS
            </p>

            <p>
              <strong>Status:</strong>
              <span class="status approved">
                Approved / Valid
              </span>
            </p>

          </div>

        `;

        return;

      }


      const joining =
        ARS_STORAGE.findJoin(id);


      if (joining) {

        const status =
          String(
            joining.status || "pending"
          ).toLowerCase();


        verificationResult.innerHTML = `

          <div class="panel-card">

            <h2>
              🤝 ARS Joining Request
            </h2>

            <p>
              <strong>Name:</strong>
              ${escapeHTML(
                joining.name
              )}
            </p>

            <p>
              <strong>Request ID:</strong>
              ${escapeHTML(
                joining.id
              )}
            </p>

            <p>
              <strong>Status:</strong>

              <span
                class="status ${escapeHTML(status)}"
              >
                ${escapeHTML(status)}
              </span>

            </p>

            ${
              status === "approved"
                ? `
                  <p class="status approved">
                    ✅ Approved.
                    Your ARS Membership Certificate
                    is available.
                  </p>

                  <a
                    class="btn"
                    href="joining-certificate.html?id=${encodeURIComponent(
                      joining.id
                    )}"
                  >
                    View Joining Certificate
                  </a>
                `
                : ""
            }

          </div>

        `;

        return;

      }


      verificationResult.innerHTML = `

        <div class="panel-card">

          <h2 class="status rejected">
            ❌ Record Not Found
          </h2>

          <p>
            No ARS certificate or joining request
            was found with this ID.
          </p>

        </div>

      `;

    }


    verifyForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        const id =
          verifyId.value.trim();

        if (id) {
          verifyRecord(id);
        }

      }
    );


    const urlId =
      new URLSearchParams(
        window.location.search
      ).get("id");


    if (urlId) {

      verifyId.value =
        urlId;

      verifyRecord(urlId);

    }

  </script>

</body>

</html>
