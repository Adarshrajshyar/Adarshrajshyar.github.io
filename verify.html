<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Verify Certificate | ARS</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef1f5;
      color: #172033;
    }

    .verify-page {
      max-width: 900px;
      margin: auto;
      padding: 25px 16px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      padding: 10px 15px;
      border-radius: 9px;
      background: #111827;
      color: #fff;
      text-decoration: none;
    }

    .hero {
      text-align: center;
      color: #fff;
      padding: 40px 20px;
      border-radius: 23px;
      background: linear-gradient(135deg, #111827, #374151);
      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 31px;
    }

    .hero p {
      margin: 0;
      opacity: .92;
    }

    .card {
      background: #fff;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 7px 24px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: 700;
      margin: 12px 0 7px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #374151;
    }

    .verify-button {
      margin-top: 17px;
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .verify-button:hover {
      opacity: .9;
    }

    .result {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border-radius: 14px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    .result.invalid {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .verified {
      color: #166534;
    }

    .result p {
      line-height: 1.7;
      margin: 8px 0;
    }

    .id {
      word-break: break-all;
      font-weight: 700;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }
  </style>
</head>

<body>

<main class="verify-page">

  <a href="index.html" class="back">
    ← ARS Home
  </a>

  <header class="hero">
    <h1>Verify Certificate</h1>
    <p>ARS Certificate Verification System</p>
  </header>

  <section class="card">

    <h2>Certificate ID डालें</h2>

    <p>
      अपने ARS certificate की authenticity check करने के लिए
      Certificate ID दर्ज करें।
    </p>

    <label for="certificateId">
      Certificate ID
    </label>

    <input
      type="text"
      id="certificateId"
      placeholder="ARS-CERT-..."
      autocomplete="off"
      maxlength="150"
    >

    <button
      type="button"
      class="verify-button"
      id="verifyButton"
    >
      Verify Certificate
    </button>

    <div
      id="result"
      class="result"
      aria-live="polite"
    ></div>

    <p class="hint">
      उदाहरण: ARS-CERT-XXXXXXXX
    </p>

  </section>

</main>


<script>
"use strict";

/* =========================================================
   ARS VERIFY SYSTEM
   verify-storage.js + verify.html
   MERGED VERSION
   ========================================================= */


/* ---------------------------------------------------------
   STORAGE KEYS
   --------------------------------------------------------- */

const ARS_VERIFY_STORAGE = {

  NORMAL_CERTIFICATES:
    "ARS_NORMAL_CERTIFICATES",

  JOINING_APPLICATIONS:
    "ARS_JOINING_APPLICATIONS"

};


/* ---------------------------------------------------------
   SAFE STORAGE READ
   --------------------------------------------------------- */

function arsReadStorage(key) {

  try {

    const raw =
      localStorage.getItem(key);

    if (!raw) {
      return [];
    }

    const parsed =
      JSON.parse(raw);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch (error) {

    console.error(
      "ARS Storage Read Error:",
      error
    );

    return [];
  }
}


/* ---------------------------------------------------------
   SAFE STORAGE WRITE
   --------------------------------------------------------- */

function arsWriteStorage(key, data) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(data)
    );

    return true;

  } catch (error) {

    console.error(
      "ARS Storage Write Error:",
      error
    );

    return false;
  }
}


/* ---------------------------------------------------------
   HTML SECURITY
   --------------------------------------------------------- */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ---------------------------------------------------------
   FIND NORMAL CERTIFICATE
   --------------------------------------------------------- */

function arsFindCertificate(certificateId) {

  const id =
    String(certificateId || "")
      .trim()
      .toUpperCase();

  if (!id) {
    return null;
  }

  const certificates =
    arsReadStorage(
      ARS_VERIFY_STORAGE.NORMAL_CERTIFICATES
    );

  return (
    certificates.find(item => {

      return String(item?.id || "")
        .trim()
        .toUpperCase() === id;

    }) || null
  );

}


/* ---------------------------------------------------------
   FIND JOINING APPLICATION
   --------------------------------------------------------- */

function arsFindJoiningApplication(applicationId) {

  const id =
    String(applicationId || "")
      .trim()
      .toUpperCase();

  if (!id) {
    return null;
  }

  const applications =
    arsReadStorage(
      ARS_VERIFY_STORAGE.JOINING_APPLICATIONS
    );

  return (
    applications.find(item => {

      return String(
        item?.applicationId || ""
      )
        .trim()
        .toUpperCase() === id;

    }) || null
  );

}


/* ---------------------------------------------------------
   VERIFY NORMAL CERTIFICATE
   --------------------------------------------------------- */

function arsVerifyNormalCertificate(certificateId) {

  const certificate =
    arsFindCertificate(
      certificateId
    );

  if (!certificate) {

    return {
      verified: false,
      type: "normal",
      data: null
    };

  }

  return {

    verified: true,
    type: "normal",
    data: certificate

  };

}


/* ---------------------------------------------------------
   VERIFY JOINING CERTIFICATE
   --------------------------------------------------------- */

function arsVerifyJoiningCertificate(applicationId) {

  const application =
    arsFindJoiningApplication(
      applicationId
    );

  if (!application) {

    return {
      verified: false,
      type: "joining",
      data: null
    };

  }

  const status =
    String(
      application.status || ""
    )
      .trim()
      .toLowerCase();


  const approved =
    status === "approved";


  return {

    verified: approved,
    type: "joining",
    data: approved
      ? application
      : null

  };

}


/* ---------------------------------------------------------
   VERIFY ANY ARS ID
   --------------------------------------------------------- */

function arsVerifyAnyId(id) {

  const cleanId =
    String(id || "")
      .trim()
      .toUpperCase();


  if (!cleanId) {

    return {
      verified: false,
      type: null,
      data: null
    };

  }


  /* Normal certificate */

  if (
    cleanId.startsWith(
      "ARS-CERT-"
    )
  ) {

    return arsVerifyNormalCertificate(
      cleanId
    );

  }


  /* Joining certificate */

  if (
    cleanId.startsWith(
      "ARS-JOIN-"
    )
  ) {

    return arsVerifyJoiningCertificate(
      cleanId
    );

  }


  /* Fallback search */

  const normal =
    arsVerifyNormalCertificate(
      cleanId
    );

  if (normal.verified) {
    return normal;
  }


  const joining =
    arsVerifyJoiningCertificate(
      cleanId
    );

  if (joining.verified) {
    return joining;
  }


  return {

    verified: false,
    type: null,
    data: null

  };

}


/* ---------------------------------------------------------
   SHOW RESULT
   --------------------------------------------------------- */

function showResult(html, valid) {

  const result =
    document.getElementById(
      "result"
    );

  if (!result) {
    return;
  }

  result.innerHTML = html;

  result.className =
    valid
      ? "result"
      : "result invalid";

  result.style.display =
    "block";

}


/* ---------------------------------------------------------
   MAIN VERIFICATION
   --------------------------------------------------------- */

function verifyCertificate() {

  const input =
    document.getElementById(
      "certificateId"
    );


  if (!input) {
    return;
  }


  const value =
    input.value.trim();


  if (!value) {

    showResult(
      `
        <h3>⚠ Certificate ID required</h3>
        <p>
          कृपया Certificate ID दर्ज करें।
        </p>
      `,
      false
    );

    input.focus();

    return;
  }


  const id =
    value.toUpperCase();


  const verification =
    arsVerifyAnyId(id);


  /* -------------------------------------------------------
     NORMAL CERTIFICATE
     ------------------------------------------------------- */

  if (
    verification.verified &&
    verification.type === "normal"
  ) {

    const certificate =
      verification.data;


    showResult(

      `
        <h3 class="verified">
          ✓ Certificate Verified
        </h3>

        <p>
          <strong>Name:</strong>
          ${escapeHTML(certificate.name)}
        </p>

        <p>
          <strong>Certificate Type:</strong>
          ${escapeHTML(certificate.type || "Certificate")}
        </p>

        ${
          certificate.profession
            ? `
              <p>
                <strong>Profession:</strong>
                ${escapeHTML(certificate.profession)}
              </p>
            `
            : ""
        }

        ${
          certificate.achievement
            ? `
              <p>
                <strong>Achievement:</strong>
                ${escapeHTML(certificate.achievement)}
              </p>
            `
            : ""
        }

        ${
          certificate.businessName
            ? `
              <p>
                <strong>Business:</strong>
                ${escapeHTML(certificate.businessName)}
              </p>
            `
            : ""
        }

        <p>
          <strong>Certificate ID:</strong>
          <span class="id">
            ${escapeHTML(certificate.id)}
          </span>
        </p>

        <p>
          <strong>Issued By:</strong>
          Adarsh Raj Shayar Official
        </p>
      `,

      true

    );

    return;
  }


  /* -------------------------------------------------------
     JOINING CERTIFICATE
     ------------------------------------------------------- */

  if (
    verification.verified &&
    verification.type === "joining"
  ) {

    const member =
      verification.data;


    showResult(

      `
        <h3 class="verified">
          ✓ ARS Joining Verified
        </h3>

        <p>
          <strong>Member Name:</strong>
          ${escapeHTML(member.name)}
        </p>

        <p>
          <strong>Role:</strong>
          ${escapeHTML(
            member.interest ||
            member.role ||
            "Member"
          )}
        </p>

        <p>
          <strong>Application / Certificate ID:</strong>
          <span class="id">
            ${escapeHTML(
              member.applicationId
            )}
          </span>
        </p>

        <p>
          <strong>Status:</strong>
          Approved
        </p>

        <p>
          <strong>Issued By:</strong>
          Adarsh Raj Shayar Official
        </p>
      `,

      true

    );

    return;
  }


  /* -------------------------------------------------------
     NOT FOUND
     ------------------------------------------------------- */

  showResult(

    `
      <h3>✕ Certificate Not Found</h3>

      <p>
        यह Certificate ID ARS के इस browser storage
        में नहीं मिली या certificate approved नहीं है।
      </p>
    `,

    false

  );

}


/* ---------------------------------------------------------
   PUBLIC ARS VERIFY OBJECT
   --------------------------------------------------------- */

window.ARSVerifyStorage = {

  read:
    arsReadStorage,

  write:
    arsWriteStorage,

  findCertificate:
    arsFindCertificate,

  findJoiningApplication:
    arsFindJoiningApplication,

  verifyCertificate:
    arsVerifyNormalCertificate,

  verifyJoining:
    arsVerifyJoiningCertificate,

  verify:
    arsVerifyAnyId

};


/* ---------------------------------------------------------
   EVENTS
   --------------------------------------------------------- */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    const button =
      document.getElementById(
        "verifyButton"
      );

    const input =
      document.getElementById(
        "certificateId"
      );


    if (button) {

      button.addEventListener(
        "click",
        verifyCertificate
      );

    }


    if (input) {

      input.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            verifyCertificate();

          }

        }
      );

    }

  }
);

</script>

</body>
</html>
