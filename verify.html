<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Verify | ARS Official</title>

  <meta
    name="description"
    content="ARS Certificate और Joining Certificate Verification">

  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

  <div class="header-inner">

    <a href="index.html" class="brand">
      <img
        src="logo.png"
        alt="ARS Logo">
      <span>ARS</span>
    </a>

    <nav class="main-nav">

      <a href="index.html">Home</a>
      <a href="shayari.html">Shayari</a>
      <a href="story.html">Story</a>
      <a href="ars-ai.html">ARS AI</a>
      <a href="joining.html">Join ARS</a>
      <a href="certificate.html">Certificate</a>
      <a
        href="verify.html"
        class="active">
        Verify
      </a>
      <a href="founder.html">Founder</a>
      <a href="contact.html">Contact</a>

    </nav>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
      aria-label="Theme बदलें">
      🌙
    </button>

  </div>

</header>

<main>

<section class="hero-section">

  <img
    src="logo.png"
    class="page-logo"
    alt="ARS Logo">

  <p class="eyebrow">
    ARS OFFICIAL
  </p>

  <h1>
    Certificate <span>Verify</span>
  </h1>

  <p>
    सही verification category चुनें और
    अपना ID / Application Number दर्ज करें।
  </p>

</section>

<section class="future-section">

  <div class="form-card">

    <p class="eyebrow">
      VERIFICATION TYPE
    </p>

    <h2>
      क्या Verify करना है?
    </h2>

    <div class="info-grid">

      <button
        type="button"
        class="info-card verify-choice"
        data-type="joining">

        <div class="card-icon">
          🤝
        </div>

        <h3>
          Joining Certificate
        </h3>

        <p>
          ARS Joining Application /
          Joining Certificate को verify करें।
        </p>

      </button>

      <button
        type="button"
        class="info-card verify-choice"
        data-type="certificate">

        <div class="card-icon">
          🏆
        </div>

        <h3>
          Normal Certificate
        </h3>

        <p>
          ARS Certificate ID से
          certificate verify करें।
        </p>

      </button>

    </div>

    <div
      id="verifyFormArea"
      style="display:none; margin-top:30px;">

      <form id="verifyForm">

        <input
          type="hidden"
          id="verifyType"
          value="">

        <div class="form-group">

          <label id="verifyLabel"
            for="verifyId">
            Verification ID
          </label>

          <input
            id="verifyId"
            type="text"
            autocomplete="off"
            placeholder="ID दर्ज करें"
            required>

        </div>

        <button
          type="submit"
          class="primary-btn">
          🔎 Verify Now
        </button>

      </form>

      <div
        id="verifyMessage"
        class="form-message"
        aria-live="polite">
      </div>

    </div>

  </div>

</section>

<section
  id="verifyResult"
  class="future-section"
  style="display:none;">

  <div class="form-card">

    <div
      id="verifyIcon"
      class="card-icon">
      ✓
    </div>

    <h2 id="verifyTitle">
      Verification Result
    </h2>

    <div id="verifyDetails">
    </div>

  </div>

</section>

</main>

<a
  href="#"
  id="backToTop"
  class="back-to-top"
  aria-label="ऊपर जाएँ">
  ↑
</a>

<script src="verify-storage.js"></script>

<script>

(function () {

  "use strict";

  const choices =
    document.querySelectorAll(
      ".verify-choice"
    );

  const formArea =
    document.getElementById(
      "verifyFormArea"
    );

  const verifyType =
    document.getElementById(
      "verifyType"
    );

  const verifyLabel =
    document.getElementById(
      "verifyLabel"
    );

  const verifyId =
    document.getElementById(
      "verifyId"
    );

  const verifyForm =
    document.getElementById(
      "verifyForm"
    );

  const message =
    document.getElementById(
      "verifyMessage"
    );

  const result =
    document.getElementById(
      "verifyResult"
    );

  const resultTitle =
    document.getElementById(
      "verifyTitle"
    );

  const details =
    document.getElementById(
      "verifyDetails"
    );

  function showType(type) {

    verifyType.value = type;

    formArea.style.display =
      "block";

    if (type === "joining") {

      verifyLabel.textContent =
        "Joining Application Number / ID";

      verifyId.placeholder =
        "ARS Joining Application Number";

    } else {

      verifyLabel.textContent =
        "Certificate ID";

      verifyId.placeholder =
        "उदाहरण: ARS-CERT-XXXXXX";

    }

    verifyId.focus();

  }

  choices.forEach(function (choice) {

    choice.addEventListener(
      "click",
      function () {

        showType(
          choice.dataset.type
        );

      }
    );

  });

  function escapeHTML(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  function showResult(data, type) {

    result.style.display =
      "block";

    if (!data) {

      resultTitle.textContent =
        "❌ Verification Failed";

      details.innerHTML =
        "<p>यह ID / Application Number नहीं मिला। कृपया दोबारा जाँचें।</p>";

      result.scrollIntoView({
        behavior: "smooth"
      });

      return;

    }

    resultTitle.textContent =
      "✅ Verified";

    details.innerHTML = `
      <div class="info-card">
        <h3>${escapeHTML(
          data.name ||
          data.fullName ||
          "ARS Member"
        )}</h3>

        <p>
          <strong>Type:</strong>
          ${escapeHTML(
            type === "joining"
              ? "Joining Certificate"
              : "Certificate"
          )}
        </p>

        <p>
          <strong>ID:</strong>
          ${escapeHTML(
            data.id ||
            data.applicationNumber ||
            data.certificateId ||
            ""
          )}
        </p>

        ${
          data.date
            ? `<p><strong>Date:</strong>
               ${escapeHTML(data.date)}</p>`
            : ""
        }

        <p>
          This record was found in the
          ARS verification system.
        </p>
      </div>
    `;

    result.scrollIntoView({
      behavior: "smooth"
    });

  }

  verifyForm.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

      const id =
        verifyId.value.trim();

      const type =
        verifyType.value;

      if (!id) {

        message.textContent =
          "कृपया ID दर्ज करें।";

        return;

      }

      let data = null;

      if (
        window.ARSVerifyStorage &&
        typeof
        window.ARSVerifyStorage.verify ===
        "function"
      ) {

        data =
          window.ARSVerifyStorage.verify(
            type,
            id
          );

      } else {

        /*
          Fallback:
          यदि verify-storage.js उपलब्ध न हो,
          तो localStorage से basic verification।
        */

        const key =
          type === "joining"
            ? "ARS_JOINING_CERTIFICATES"
            : "ARS_CERTIFICATES";

        try {

          const records =
            JSON.parse(
              localStorage.getItem(key) ||
              "[]"
            );

          data =
            records.find(
              record =>
                String(
                  record.id ||
                  record.applicationNumber ||
                  record.certificateId ||
                  ""
                ).toUpperCase() ===
                id.toUpperCase()
            ) || null;

        } catch {

          data = null;

        }

      }

      showResult(
        data,
        type
      );

    }
  );

  /* Theme */

  const themeToggle =
    document.getElementById(
      "themeToggle"
    );

  function applyTheme(theme) {

    document.documentElement.dataset.theme =
      theme;

    localStorage.setItem(
      "ars-theme",
      theme
    );

    if (themeToggle) {

      themeToggle.textContent =
        theme === "dark"
          ? "☀️"
          : "🌙";

    }

  }

  applyTheme(
    localStorage.getItem("ars-theme") ||
    "light"
  );

  if (themeToggle) {

    themeToggle.addEventListener(
      "click",
      function () {

        const current =
          document.documentElement.dataset.theme ||
          "light";

        applyTheme(
          current === "dark"
            ? "light"
            : "dark"
        );

      }
    );

  }

  /* Back to top */

  const backToTop =
    document.getElementById(
      "backToTop"
    );

  window.addEventListener(
    "scroll",
    function () {

      if (!backToTop) return;

      backToTop.style.display =
        window.scrollY > 350
          ? "flex"
          : "none";

    }
  );

  if (backToTop) {

    backToTop.addEventListener(
      "click",
      function (event) {

        event.preventDefault();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );

  }

})();

</script>

</body>
</html>
