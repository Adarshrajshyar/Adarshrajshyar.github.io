<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ARS Joining Certificate</title>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>

</head>


<body>


<header class="site-header">

  <nav class="navbar">

    <a class="brand" href="index.html">

      <img
        class="brand-logo"
        src="logo.png"
        alt="ARS Logo"
      >

      <span>

        <strong>ARS Official</strong>

        <small>Adarsh Raj Shayar</small>

      </span>

    </a>


    <div class="nav-links">

      <a href="index.html">Home</a>

      <a href="joining.html">
        Join ARS
      </a>

      <a href="certificate.html">
        Certificate
      </a>

      <a href="verify.html">
        Verify
      </a>

      <a href="founder.html">
        Founder
      </a>

    </div>

  </nav>

</header>


<main>

<section class="section">

  <div class="section-heading">

    <span>ARS COMMUNITY</span>

    <h2>ARS Joining Certificate</h2>

    <p>
      Approved ARS member के लिए joining certificate।
    </p>

  </div>


  <div class="form-card">

    <form id="joiningCertificateForm">

      <div class="form-row">

        <div class="form-group">

          <label for="memberName">
            Member Name
          </label>

          <input
            id="memberName"
            required
          >

        </div>


        <div class="form-group">

          <label for="memberRole">
            ARS Role
          </label>

          <select id="memberRole" required>

            <option value="">
              Select Role
            </option>

            <option>Writer</option>
            <option>Creator</option>
            <option>Supporter</option>
            <option>Shayar</option>
            <option>Instagram Creator</option>
            <option>YouTube Creator</option>

          </select>

        </div>

      </div>


      <button
        class="primary-btn"
        type="submit"
      >
        Generate Joining Certificate
      </button>

    </form>

  </div>


  <div
    id="joiningCertificateOutput"
    style="margin-top:30px;"
  ></div>

</section>

</main>


<footer class="site-footer">

  <div class="footer-inner">

    <div class="footer-brand">

      <img src="logo.png" alt="ARS Logo">

      <div>

        <h3>Adarsh Raj Shayar</h3>

        <p>
          ARS Official — Member Certificate
        </p>

      </div>

    </div>

  </div>

</footer>


<script>

(function () {

  "use strict";


  const form =
    document.getElementById(
      "joiningCertificateForm"
    );


  const output =
    document.getElementById(
      "joiningCertificateOutput"
    );


  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value ?? "";

    return div.innerHTML;

  }


  function generateMemberID() {

    const random =
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();


    return `
      ARS-MEMBER-${new Date().getFullYear()}-${random}
    `.replace(/\s+/g, "");

  }


  form.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();


      const name =
        document
          .getElementById("memberName")
          .value.trim();


      const role =
        document
          .getElementById("memberRole")
          .value;


      if (!name || !role) {

        alert(
          "कृपया Name और Role भरें।"
        );

        return;

      }


      const memberID =
        generateMemberID();


      const certificate = {

        id: memberID,

        name,

        type: "ARS Membership",

        role,

        issuedAt:
          new Date().toISOString(),

        issuedBy:
          "Adarsh Raj — Founder, ARS Official"

      };


      if (window.ARSStorage) {

        window.ARSStorage.saveCertificate(
          certificate
        );

      }


      const verifyURL =
        `${window.location.origin}/verify.html?id=${encodeURIComponent(memberID)}`;


      output.innerHTML = `

        <div
          id="joiningCertificate"
          style="
            max-width:900px;
            margin:auto;
            padding:50px;
            background:#fff;
            border:10px solid #8b1e3f;
            outline:2px solid #b88932;
            outline-offset:-20px;
            text-align:center;
            box-shadow:0 15px 45px rgba(0,0,0,.12);
          "
        >

          <img
            src="logo.png"
            alt="ARS Logo"
            style="
              width:90px;
              height:90px;
              object-fit:contain;
              margin:auto;
            "
          >


          <p
            style="
              color:#b88932;
              font-weight:900;
              letter-spacing:3px;
            "
          >
            ARS OFFICIAL
          </p>


          <h1
            style="
              color:#8b1e3f;
              font-size:40px;
              margin:10px 0;
            "
          >
            MEMBERSHIP CERTIFICATE
          </h1>


          <p>
            This certificate proudly confirms that
          </p>


          <h2
            style="
              font-size:34px;
              margin:15px 0;
            "
          >
            ${escapeHTML(name)}
          </h2>


          <p>
            is recognized as an
            <strong>
              ARS Official Member
            </strong>
          </p>


          <p>
            Role:
            <strong>
              ${escapeHTML(role)}
            </strong>
          </p>


          <div
            style="
              margin-top:40px;
              display:flex;
              justify-content:space-between;
              align-items:end;
              gap:20px;
            "
          >

            <div style="text-align:left;">

              <img
                src="signature.jpg"
                alt="Founder Signature"
                style="
                  width:130px;
                  height:55px;
                  object-fit:contain;
                "
              >

              <div
                style="
                  border-top:1px solid #555;
                  padding-top:5px;
                "
              >
                Founder
              </div>

              <strong>
                Adarsh Raj
              </strong>

            </div>


            <div
              style="
                text-align:right;
                font-size:12px;
              "
            >

              <strong>
                Member ID
              </strong>

              <br>

              ${memberID}

            </div>

          </div>


          <div
            style="
              margin-top:25px;
              padding-top:15px;
              border-top:1px solid #ddd;
              font-size:12px;
              color:#666;
            "
          >

            Scan / Open to verify:
            <br>

            ${verifyURL}

          </div>

        </div>


        <div
          style="
            text-align:center;
            margin-top:20px;
          "
        >

          <button
            class="primary-btn"
            onclick="window.print()"
          >
            🖨️ Print Joining Certificate
          </button>

        </div>

      `;

    }
  );

})();

</script>


</body>
</html>
