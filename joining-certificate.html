<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ARS Joining Certificate</title>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="certificate.js"></script>
</head>

<body>

<header class="site-header">

  <nav class="navbar">

    <a class="logo" href="index.html">
      🌹 ARS Official
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="joining.html">Join ARS</a>
      <a href="certificate.html">Certificate</a>
      <a href="verify.html">Verify</a>
    </div>

  </nav>

</header>


<main class="section">

  <div class="form-card">

    <div class="join-header">

      <div class="join-icon">🏅</div>

      <h1>ARS Joining Certificate</h1>

      <p>
        Enter your ARS Joining Request ID to check
        approval and access your membership certificate.
      </p>

    </div>


    <form id="certificateCheckForm">

      <label for="rid">
        Joining Request ID
      </label>

      <input
        id="rid"
        type="text"
        required
        placeholder="Example: ARS-JOIN-XXXX"
      >

      <button
        class="btn"
        type="submit"
      >
        🔎 Check Approval
      </button>

    </form>

  </div>


  <div id="out"></div>

</main>


<script>
(function () {

  "use strict";

  const form =
    document.getElementById("certificateCheckForm");

  const input =
    document.getElementById("rid");

  const output =
    document.getElementById("out");


  const params =
    new URLSearchParams(window.location.search);

  const queryId =
    params.get("id");


  if (queryId) {
    input.value = queryId;
  }


  form.addEventListener("submit", function (event) {

    event.preventDefault();

    const id =
      input.value.trim();

    if (!id) {
      showError("Please enter your Joining Request ID.");
      return;
    }


    const requests =
      ARS_STORAGE.joins();

    const request =
      requests.find(
        item =>
          String(item.id).toLowerCase() ===
          id.toLowerCase()
      );


    if (!request) {

      showError(
        "Joining Request not found. Please check your ID."
      );

      return;
    }


    if (request.status !== "approved") {

      const statusText =
        request.status === "rejected"
          ? "Rejected"
          : "Pending Approval";


      output.innerHTML = `
        <div class="form-card">

          <h2>🤝 ARS Joining Status</h2>

          <p>
            <b>Name:</b>
            ${escapeHTML(request.name)}
          </p>

          <p>
            <b>Request ID:</b>
            ${escapeHTML(request.id)}
          </p>

          <p>
            <b>Status:</b>
            <span class="status ${
              request.status === "rejected"
                ? "rejected"
                : "pending"
            }">
              ${statusText}
            </span>
          </p>

          ${
            request.status === "pending"
              ? `
                <p>
                  ⏳ Your certificate will become available
                  after ARS approval.
                </p>
              `
              : `
                <p>
                  ❌ This joining request was not approved.
                </p>
              `
          }

        </div>
      `;

      return;
    }


    /*
      Approved request:
      Generate the Membership Certificate.
    */

    const certificateId =
      "ARS-MEMBER-" +
      String(request.id)
        .replace(/^ARS-JOIN-/i, "")
        .replace(/[^A-Z0-9-]/gi, "");


    let certificate =
      ARS_STORAGE.findCertificate(certificateId);


    if (!certificate) {

      certificate =
        ARS_CERTIFICATE.create({

          id: certificateId,

          name: request.name,

          type: "Membership",

          status: "approved",

          issuedAt:
            request.updatedAt ||
            new Date().toISOString()

        });

    }


    output.innerHTML = `
      <div class="panel-card approved-banner">

        <h2>🎉 Congratulations!</h2>

        <p>
          Your ARS joining request has been approved.
          Your membership certificate is ready.
        </p>

      </div>

      <div id="certificateResult"></div>
    `;


    const certificateResult =
      document.getElementById("certificateResult");


    ARS_CERTIFICATE.render(
      certificate,
      certificateResult
    );

  });


  function showError(message) {

    output.innerHTML = `
      <div class="form-card">

        <p class="status rejected">
          ❌ ${escapeHTML(message)}
        </p>

      </div>
    `;
  }


  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value ?? "";

    return div.innerHTML;
  }

})();
</script>

</body>
</html>
