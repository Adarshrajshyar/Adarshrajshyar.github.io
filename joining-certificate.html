<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ARS Joining Certificate</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="certificate.js"></script>

</head>

<body>

  <header class="site-header">

    <nav class="navbar">

      <a
        class="logo"
        href="index.html"
      >
        🌹 ARS Official
      </a>

      <div class="nav-links">

        <a href="index.html">
          Home
        </a>

        <a href="joining.html">
          Join ARS
        </a>

        <a href="certificate.html">
          Certificate
        </a>

        <a href="verify.html">
          Verify
        </a>

      </div>

    </nav>

  </header>


  <main class="section">

    <div class="form-card">

      <h1>
        🏅 ARS Joining Certificate
      </h1>

      <p>
        Enter your approved ARS Joining Request ID
        to view your membership certificate.
      </p>

      <label for="requestId">
        Joining Request ID
      </label>

      <input
        id="requestId"
        type="text"
        placeholder="ARS-JOIN-XXXXXXXX"
        autocomplete="off"
      >

      <button
        class="btn"
        id="checkApproval"
        type="button"
      >
        Check Approval
      </button>

      <div id="joiningResult"></div>

    </div>

  </main>


  <script>

    const requestInput =
      document.getElementById("requestId");

    const checkButton =
      document.getElementById("checkApproval");

    const resultBox =
      document.getElementById("joiningResult");


    function showResult(html) {

      resultBox.innerHTML = html;

    }


    checkButton.addEventListener(
      "click",
      function () {

        const id =
          requestInput.value.trim();

        if (!id) {

          showResult(`
            <p class="status rejected">
              Please enter your Joining Request ID.
            </p>
          `);

          return;
        }


        const request =
          ARS_STORAGE.findJoin(id);


        if (!request) {

          showResult(`
            <div class="panel-card">

              <h3 class="status rejected">
                ❌ Request Not Found
              </h3>

              <p>
                Please check your Joining Request ID
                and try again.
              </p>

            </div>
          `);

          return;
        }


        if (
          String(request.status).toLowerCase()
          !== "approved"
        ) {

          showResult(`
            <div class="panel-card">

              <h3 class="status pending">
                ⏳ Approval Pending
              </h3>

              <p>
                <strong>Name:</strong>
                ${request.name || ""}
              </p>

              <p>
                <strong>Status:</strong>
                ${request.status || "pending"}
              </p>

              <p>
                Your joining certificate will be
                available after ARS approval.
              </p>

            </div>
          `);

          return;
        }


        const certificate =
          ARS_CERTIFICATE.create({

            id:
              "ARS-MEMBER-" +
              id
                .replace(/^ARS-JOIN-/i, ""),

            name:
              request.name,

            type:
              "Membership",

            status:
              "approved"

          });


        ARS_CERTIFICATE.render(
          certificate,
          resultBox
        );

      }
    );


    const urlId =
      new URLSearchParams(
        window.location.search
      ).get("id");


    if (urlId) {

      requestInput.value =
        urlId;

      checkButton.click();

    }

  </script>

</body>

</html>
