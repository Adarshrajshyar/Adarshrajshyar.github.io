<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARS Admin Panel</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .panel-page {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .panel-card {
      background: var(--card-bg, #fff);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .panel-card h2 {
      margin-top: 0;
    }

    .panel-form {
      display: grid;
      gap: 14px;
    }

    .panel-form input,
    .panel-form textarea,
    .panel-form select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font: inherit;
    }

    .panel-form textarea {
      min-height: 130px;
      resize: vertical;
    }

    .panel-btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .panel-btn.primary {
      background: #111827;
      color: #fff;
    }

    .panel-btn.danger {
      background: #dc2626;
      color: #fff;
    }

    .panel-btn.success {
      background: #15803d;
      color: #fff;
    }

    .admin-login {
      max-width: 430px;
      margin: 80px auto;
    }

    .admin-dashboard {
      display: none;
    }

    .admin-item {
      padding: 15px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-top: 12px;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status.approved {
      background: #dcfce7;
      color: #166534;
    }

    .status.rejected {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">🌹 ARS</a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="joining.html">Join ARS</a>
        <a href="certificate.html">Certificate</a>
        <a href="verify.html">Verify</a>
      </div>
    </nav>
  </header>

  <main class="panel-page">

    <!-- LOGIN -->
    <section id="adminLogin" class="panel-card admin-login">

      <h1>🔐 ARS Admin Panel</h1>
      <p>Authorized access only.</p>

      <form id="adminLoginForm" class="panel-form">

        <input
          type="password"
          id="adminPassword"
          placeholder="Enter admin password"
          required
        >

        <button
          type="submit"
          class="panel-btn primary"
        >
          Login
        </button>

      </form>

      <p id="adminLoginMessage"></p>

    </section>


    <!-- DASHBOARD -->
    <section id="adminDashboard" class="admin-dashboard">

      <div class="panel-card">

        <h1>🌹 ARS Admin Dashboard</h1>

        <p>
          Manage joining requests, certificates,
          Shayari and Stories.
        </p>

        <button
          id="adminLogout"
          class="panel-btn danger"
        >
          Logout
        </button>

      </div>


      <!-- JOINING REQUESTS -->
      <div class="panel-card">

        <h2>🤝 Joining Requests</h2>

        <div id="joiningRequestsList">
          Loading...
        </div>

      </div>


      <!-- PUBLISH SHAYARI -->
      <div class="panel-card">

        <h2>🌹 Publish Shayari</h2>

        <form id="shayariPublishForm" class="panel-form">

          <input
            id="publishShayariText"
            placeholder="Write Shayari"
            required
          >

          <select id="publishShayariCategory">

            <option value="love">❤️ Love</option>
            <option value="sad">💔 Sad</option>
            <option value="attitude">🔥 Attitude</option>
            <option value="friendship">🤝 Friendship</option>
            <option value="motivation">💪 Motivation</option>

          </select>

          <input
            id="publishShayariAuthor"
            placeholder="Author"
            value="Adarsh Raj"
          >

          <button
            class="panel-btn primary"
            type="submit"
          >
            Publish Shayari
          </button>

        </form>

      </div>


      <!-- PUBLISH STORY -->
      <div class="panel-card">

        <h2>📖 Publish Story / Poem</h2>

        <form id="storyPublishForm" class="panel-form">

          <input
            id="publishStoryTitle"
            placeholder="Title"
            required
          >

          <textarea
            id="publishStoryContent"
            placeholder="Write Story or Poem"
            required
          ></textarea>

          <select id="publishStoryCategory">

            <option value="motivation">💪 Motivation</option>
            <option value="life">🌱 Life</option>
            <option value="friendship">🤝 Friendship</option>
            <option value="education">📚 Education</option>
            <option value="dream">✨ Dream</option>
            <option value="inspiration">🌟 Inspiration</option>

          </select>

          <select id="publishStoryType">

            <option value="story">📖 Story</option>
            <option value="poem">✍️ Poem</option>

          </select>

          <input
            id="publishStoryAuthor"
            placeholder="Author"
            value="Adarsh Raj"
          >

          <button
            class="panel-btn primary"
            type="submit"
          >
            Publish
          </button>

        </form>

      </div>


      <!-- CONTACT MESSAGES -->
      <div class="panel-card">

        <h2>📩 Contact Messages</h2>

        <div id="contactMessagesList">
          Loading...
        </div>

      </div>

    </section>

  </main>


  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="shayari.js"></script>
  <script src="story.js"></script>

  <script>

    const ADMIN_PASSWORD =
      (window.ARS_CONFIG &&
       window.ARS_CONFIG.ADMIN_PASSWORD)
      || "ARS_ADMIN_2026";

    const login =
      document.getElementById("adminLogin");

    const dashboard =
      document.getElementById("adminDashboard");

    function showDashboard() {

      login.style.display = "none";
      dashboard.style.display = "block";

      loadJoiningRequests();
      loadContactMessages();
    }

    document
      .getElementById("adminLoginForm")
      .addEventListener("submit", function(e) {

        e.preventDefault();

        const password =
          document.getElementById(
            "adminPassword"
          ).value;

        if (password === ADMIN_PASSWORD) {

          sessionStorage.setItem(
            "ARS_ADMIN_AUTH",
            "true"
          );

          showDashboard();

        } else {

          document.getElementById(
            "adminLoginMessage"
          ).textContent =
            "❌ Incorrect password.";

        }

      });


    document
      .getElementById("adminLogout")
      .addEventListener("click", function() {

        sessionStorage.removeItem(
          "ARS_ADMIN_AUTH"
        );

        location.reload();

      });


    function loadJoiningRequests() {

      const box =
        document.getElementById(
          "joiningRequestsList"
        );

      const requests =
        window.ARS_STORAGE.getJoiningRequests();

      if (!requests.length) {

        box.innerHTML =
          "<p>No joining requests.</p>";

        return;
      }

      box.innerHTML =
        requests.map(function(item) {

          return `
            <div class="admin-item">

              <strong>
                ${escapeHTML(item.name || "Unknown")}
              </strong>

              <p>
                Email:
                ${escapeHTML(item.email || "-")}
              </p>

              <span class="status ${escapeHTML(
                item.status || "pending"
              )}">
                ${escapeHTML(
                  item.status || "pending"
                )}
              </span>

              <div class="admin-actions">

                <button
                  class="panel-btn success"
                  onclick="updateRequest(
                    '${escapeHTML(item.id)}',
                    'approved'
                  )"
                >
                  Approve
                </button>

                <button
                  class="panel-btn danger"
                  onclick="updateRequest(
                    '${escapeHTML(item.id)}',
                    'rejected'
                  )"
                >
                  Reject
                </button>

              </div>

            </div>
          `;

        }).join("");

    }


    function updateRequest(id, status) {

      window.ARS_STORAGE.updateJoiningRequest(
        id,
        { status: status }
      );

      loadJoiningRequests();

    }


    document
      .getElementById("shayariPublishForm")
      .addEventListener("submit", function(e) {

        e.preventDefault();

        if (
          !window.ARS_SHAYARI ||
          !window.ARS_SHAYARI.publish
        ) return;

        window.ARS_SHAYARI.publish({

          text:
            document.getElementById(
              "publishShayariText"
            ).value,

          category:
            document.getElementById(
              "publishShayariCategory"
            ).value,

          author:
            document.getElementById(
              "publishShayariAuthor"
            ).value

        });

        alert("🌹 Shayari published successfully!");

        this.reset();

      });


    document
      .getElementById("storyPublishForm")
      .addEventListener("submit", function(e) {

        e.preventDefault();

        if (
          !window.ARS_STORY ||
          !window.ARS_STORY.publish
        ) return;

        window.ARS_STORY.publish({

          title:
            document.getElementById(
              "publishStoryTitle"
            ).value,

          content:
            document.getElementById(
              "publishStoryContent"
            ).value,

          category:
            document.getElementById(
              "publishStoryCategory"
            ).value,

          type:
            document.getElementById(
              "publishStoryType"
            ).value,

          author:
            document.getElementById(
              "publishStoryAuthor"
            ).value

        });

        alert("📖 Content published successfully!");

        this.reset();

      });


    function loadContactMessages() {

      const box =
        document.getElementById(
          "contactMessagesList"
        );

      const messages =
        window.ARS_STORAGE.getContactMessages();

      if (!messages.length) {

        box.innerHTML =
          "<p>No contact messages.</p>";

        return;
      }

      box.innerHTML =
        messages
          .slice()
          .reverse()
          .map(function(message) {

            return `
              <div class="admin-item">

                <strong>
                  ${escapeHTML(message.name)}
                </strong>

                <p>
                  ${escapeHTML(message.email)}
                </p>

                <p>
                  <strong>
                    ${escapeHTML(message.subject)}
                  </strong>
                </p>

                <p>
                  ${escapeHTML(message.message)}
                </p>

              </div>
            `;

          })
          .join("");

    }


    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value == null ? "" : value;

      return div.innerHTML;

    }


    if (
      sessionStorage.getItem(
        "ARS_ADMIN_AUTH"
      ) === "true"
    ) {
      showDashboard();
    }

  </script>

</body>
</html>
