<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARS Admin Panel</title>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>
</head>

<body>

<header class="site-header">
  <nav class="navbar">
    <a class="logo" href="index.html">🌹 ARS Admin</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="publisher.html">Publisher</a>
      <a href="joining.html">Join ARS</a>
      <a href="verify.html">Verify</a>
    </div>
  </nav>
</header>

<main class="section">

  <!-- LOGIN -->
  <section id="adminLogin" class="form-card">

    <h1>🔐 Admin Login</h1>

    <p>
      Login to manage ARS joining requests and contact messages.
    </p>

    <input
      id="adminPassword"
      type="password"
      placeholder="Enter Admin Password"
      autocomplete="current-password"
    >

    <button
      class="btn"
      id="adminLoginBtn"
      type="button"
    >
      Login
    </button>

    <p id="adminLoginMessage"></p>

  </section>


  <!-- DASHBOARD -->
  <section id="adminDashboard" style="display:none">

    <div class="panel-card">

      <h1>🌹 ARS Admin Dashboard</h1>

      <p>
        Manage joining approvals and contact messages.
      </p>

      <button
        class="btn"
        id="adminLogoutBtn"
        type="button"
      >
        Logout
      </button>

    </div>


    <!-- JOINING REQUESTS -->
    <div class="panel-card">

      <h2>🤝 Joining Requests</h2>

      <div id="joiningRequests">
        Loading...
      </div>

    </div>


    <!-- CONTACT MESSAGES -->
    <div class="panel-card">

      <h2>📩 Contact Messages</h2>

      <div id="contactMessages">
        Loading...
      </div>

    </div>

  </section>

</main>


<script>

"use strict";

const ADMIN_SESSION = "ARS_ADMIN_LOGGED_IN";

const loginBox =
  document.getElementById("adminLogin");

const dashboard =
  document.getElementById("adminDashboard");

const passwordInput =
  document.getElementById("adminPassword");

const loginButton =
  document.getElementById("adminLoginBtn");

const logoutButton =
  document.getElementById("adminLogoutBtn");

const loginMessage =
  document.getElementById("adminLoginMessage");

const joiningBox =
  document.getElementById("joiningRequests");

const messagesBox =
  document.getElementById("contactMessages");


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;
}


function showDashboard() {

  loginBox.style.display = "none";

  dashboard.style.display = "block";

  loadJoiningRequests();

  loadContactMessages();

}


function showLogin() {

  loginBox.style.display = "block";

  dashboard.style.display = "none";

}


function loadJoiningRequests() {

  const requests =
    ARS_STORAGE.joins();

  if (!requests.length) {

    joiningBox.innerHTML =
      "<p>No joining requests yet.</p>";

    return;
  }


  joiningBox.innerHTML =
    requests
      .slice()
      .reverse()
      .map(request => {

        const status =
          String(
            request.status || "pending"
          ).toLowerCase();


        return `

          <article class="content-card">

            <span class="tag">
              ${escapeHTML(status)}
            </span>

            <h3>
              ${escapeHTML(request.name)}
            </h3>

            <p>
              <strong>Email:</strong>
              ${escapeHTML(request.email)}
            </p>

            ${
              request.reason
                ? `
                  <p>
                    <strong>Reason:</strong><br>
                    ${escapeHTML(request.reason)}
                  </p>
                `
                : ""
            }

            <p>
              <strong>Request ID:</strong>
              ${escapeHTML(request.id)}
            </p>

            <p>
              <strong>Status:</strong>
              <span class="status ${escapeHTML(status)}">
                ${escapeHTML(status)}
              </span>
            </p>

            <div class="card-actions">

              <button
                class="btn"
                type="button"
                onclick="updateJoining(
                  '${encodeURIComponent(request.id)}',
                  'approved'
                )"
              >
                ✅ Approve
              </button>

              <button
                class="btn"
                type="button"
                onclick="updateJoining(
                  '${encodeURIComponent(request.id)}',
                  'rejected'
                )"
              >
                ❌ Reject
              </button>

              ${
                status === "approved"
                  ? `
                    <a
                      class="btn"
                      href="joining-certificate.html?id=${encodeURIComponent(
                        request.id
                      )}"
                    >
                      🏅 Certificate
                    </a>
                  `
                  : ""
              }

            </div>

          </article>

        `;

      })
      .join("");

}


function updateJoining(encodedId, status) {

  const id =
    decodeURIComponent(encodedId);

  const result =
    ARS_STORAGE.updateJoin(
      id,
      {
        status: status
      }
    );


  if (!result) {

    alert("Joining request not found.");

    return;

  }


  loadJoiningRequests();

}


function loadContactMessages() {

  const messages =
    ARS_STORAGE
      .messages()
      .slice()
      .reverse();


  if (!messages.length) {

    contactMessages.innerHTML =
      "<p>No contact messages yet.</p>";

    return;

  }


  contactMessages.innerHTML =
    messages
      .map(message => {

        return `

          <article class="content-card">

            <span class="tag">
              ${message.read ? "Read" : "New"}
            </span>

            <h3>
              ${escapeHTML(message.subject || "Contact Message")}
            </h3>

            <p>
              <strong>Name:</strong>
              ${escapeHTML(message.name)}
            </p>

            <p>
              <strong>Email:</strong>
              ${escapeHTML(message.email)}
            </p>

            <p>
              <strong>Message:</strong><br>
              ${escapeHTML(message.message)}
            </p>

            <p>
              <small>
                ${message.createdAt
                  ? new Date(
                      message.createdAt
                    ).toLocaleString("en-IN")
                  : ""
                }
              </small>
            </p>

            ${
              !message.read
                ? `
                  <button
                    class="btn"
                    type="button"
                    onclick="markRead(
                      '${encodeURIComponent(message.id)}'
                    )"
                  >
                    ✓ Mark as Read
                  </button>
                `
                : ""
            }

          </article>

        `;

      })
      .join("");

}


function markRead(encodedId) {

  const id =
    decodeURIComponent(encodedId);

  ARS_STORAGE.markMessageRead(id);

  loadContactMessages();

}


loginButton.addEventListener(
  "click",
  function () {

    const password =
      passwordInput.value;

    if (
      password ===
      ARS_CONFIG.ADMIN_PASSWORD
    ) {

      sessionStorage.setItem(
        ADMIN_SESSION,
        "true"
      );

      loginMessage.textContent = "";

      showDashboard();

    } else {

      loginMessage.textContent =
        "❌ Incorrect admin password.";

    }

  }
);


passwordInput.addEventListener(
  "keydown",
  function (event) {

    if (event.key === "Enter") {
      loginButton.click();
    }

  }
);


logoutButton.addEventListener(
  "click",
  function () {

    sessionStorage.removeItem(
      ADMIN_SESSION
    );

    passwordInput.value = "";

    showLogin();

  }
);


if (
  sessionStorage.getItem(
    ADMIN_SESSION
  ) === "true"
) {

  showDashboard();

}

</script>

</body>
</html>
