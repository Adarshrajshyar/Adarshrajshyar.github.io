<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ARS Admin Panel</title>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="storage.js"></script>

</head>

<body>

<header class="site-header">

  <nav class="navbar">

    <a class="logo" href="index.html">
      🌹 ARS Admin
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="publisher.html">Publisher</a>
      <a href="joining.html">Join ARS</a>
    </div>

  </nav>

</header>

<main class="section">

  <!-- LOGIN -->

  <div id="adminLogin" class="form-card">

    <h1>🔐 Admin Login</h1>

    <p>
      Authorized ARS administration only.
    </p>

    <input
      id="adminPassword"
      type="password"
      placeholder="Admin Password"
    >

    <button
      class="btn"
      id="adminLoginBtn"
    >
      Login
    </button>

    <p id="adminLoginMessage"></p>

  </div>


  <!-- DASHBOARD -->

  <div id="adminDashboard" style="display:none;">

    <div class="panel-card">

      <h1>🌹 ARS Admin Dashboard</h1>

      <p>
        Manage joining requests and contact messages.
      </p>

      <button
        class="btn"
        id="adminLogout"
      >
        Logout
      </button>

    </div>


    <!-- JOINING REQUESTS -->

    <section class="panel-card">

      <h2>🤝 Joining Requests</h2>

      <div id="joiningRequests">
        Loading...
      </div>

    </section>


    <!-- CONTACT MESSAGES -->

    <section class="panel-card">

      <h2>📩 Contact Messages</h2>

      <div id="contactMessages">
        Loading...
      </div>

    </section>


    <!-- CERTIFICATES -->

    <section class="panel-card">

      <h2>🏆 Generated Certificates</h2>

      <div id="certificateList">
        Loading...
      </div>

    </section>

  </div>

</main>


<script>

document.addEventListener("DOMContentLoaded", function () {

  const SESSION_KEY = "ARS_ADMIN_LOGGED_IN";

  const loginBox =
    document.getElementById("adminLogin");

  const dashboard =
    document.getElementById("adminDashboard");

  const password =
    document.getElementById("adminPassword");

  const loginButton =
    document.getElementById("adminLoginBtn");

  const loginMessage =
    document.getElementById("adminLoginMessage");

  const logoutButton =
    document.getElementById("adminLogout");


  loginButton.addEventListener("click", function () {

    if (
      password.value ===
      ARS_CONFIG.ADMIN_PASSWORD
    ) {

      sessionStorage.setItem(
        SESSION_KEY,
        "true"
      );

      showDashboard();

    } else {

      loginMessage.innerHTML =
        '<span class="status rejected">❌ Incorrect password.</span>';

    }

  });


  logoutButton.addEventListener("click", function () {

    sessionStorage.removeItem(
      SESSION_KEY
    );

    location.reload();

  });


  function showDashboard() {

    loginBox.style.display = "none";

    dashboard.style.display = "block";

    loadAllData();

  }


  function loadAllData() {

    loadJoiningRequests();

    loadMessages();

    loadCertificates();

  }


  function loadJoiningRequests() {

    const box =
      document.getElementById("joiningRequests");

    const requests =
      ARS_STORAGE.joins();

    if (!requests.length) {

      box.innerHTML =
        "<p>No joining requests found.</p>";

      return;

    }

    box.innerHTML =
      requests.map(function (request) {

        return `
          <div class="content-card">

            <h3>
              ${escapeHtml(request.name)}
            </h3>

            <p>
              <b>Email:</b>
              ${escapeHtml(request.email)}
            </p>

            <p>
              <b>Request ID:</b>
              ${escapeHtml(request.id)}
            </p>

            <p>
              <b>Status:</b>
              <span class="status ${request.status}">
                ${escapeHtml(request.status)}
              </span>
            </p>

            <p>
              ${escapeHtml(request.reason || "")}
            </p>

            <div class="card-actions">

              <button
                class="btn"
                onclick="updateJoining(
                  '${escapeAttribute(request.id)}',
                  'approved'
                )"
              >
                ✅ Approve
              </button>

              <button
                class="btn"
                onclick="updateJoining(
                  '${escapeAttribute(request.id)}',
                  'rejected'
                )"
              >
                ❌ Reject
              </button>

            </div>

          </div>
        `;

      }).join("");

  }


  window.updateJoining =
    function (id, status) {

      ARS_STORAGE.updateJoin(
        id,
        { status: status }
      );

      loadAllData();

    };


  function loadMessages() {

    const box =
      document.getElementById("contactMessages");

    const messages =
      ARS_STORAGE.messages()
        .slice()
        .reverse();

    if (!messages.length) {

      box.innerHTML =
        "<p>No contact messages found.</p>";

      return;

    }

    box.innerHTML =
      messages.map(function (message) {

        return `
          <div class="content-card">

            <h3>
              ${escapeHtml(message.subject || "Contact Message")}
            </h3>

            <p>
              <b>Name:</b>
              ${escapeHtml(message.name)}
            </p>

            <p>
              <b>Email:</b>
              ${escapeHtml(message.email)}
            </p>

            <p>
              ${escapeHtml(message.message)}
            </p>

            <small>
              ${message.createdAt
                ? new Date(message.createdAt).toLocaleString()
                : ""}
            </small>

          </div>
        `;

      }).join("");

  }


  function loadCertificates() {

    const box =
      document.getElementById("certificateList");

    const certificates =
      ARS_STORAGE.certificates()
        .slice()
        .reverse();

    if (!certificates.length) {

      box.innerHTML =
        "<p>No certificates generated yet.</p>";

      return;

    }

    box.innerHTML =
      certificates.map(function (certificate) {

        return `
          <div class="content-card">

            <h3>
              ${escapeHtml(certificate.name)}
            </h3>

            <p>
              <b>Type:</b>
              ${escapeHtml(certificate.type)}
            </p>

            <p>
              <b>ID:</b>
              ${escapeHtml(certificate.id)}
            </p>

            <p>
              <b>Status:</b>
              <span class="status approved">
                ${escapeHtml(certificate.status)}
              </span>
            </p>

            <a
              class="btn"
              href="verify.html?id=${encodeURIComponent(certificate.id)}"
            >
              🔎 Verify
            </a>

          </div>
        `;

      }).join("");

  }


  function escapeHtml(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value ?? "";

    return div.innerHTML;

  }


  function escapeAttribute(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }


  if (
    sessionStorage.getItem(SESSION_KEY)
    === "true"
  ) {

    showDashboard();

  }

});

</script>

</body>
</html>
